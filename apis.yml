aid: lokki
name: Lokki
description: Lokki is a Grenoble, France rental-management SaaS (getlokki.com) used by 2,500+ equipment
  rental businesses across bikes, e-bikes, scooters, cars, ski, climbing, surf, paddle, canoe/kayak,
  boats, event gear, groundskeeping equipment and tooling, paired with the lokki.rent consumer rental
  marketplace. Lokki publishes a partner-facing read-only REST API — the Lokki External API, seven
  operations on https://prod.api.eu-west-3.lokki.rent covering stores (rental providers), store items
  with date-range pricing and stock, and the verticale/category taxonomy — documented on a Mintlify
  docs host at docs.getlokki.com with an OpenAPI 3.1 specification, llms.txt, an A2A agent card, a
  provider-authored Agent Skill and an anonymous documentation MCP server. Authentication is an
  environment-scoped API key in the x-api-key header (lokki_sk_test_ for staging, lokki_sk_live_ for
  production) issued by a Lokki representative under a partnership agreement, with scopes at domain,
  action and route level. The same production host also serves an unauthenticated NestJS Swagger
  document for the 896-operation internal Dashboard / Online Store API. Lokki has raised roughly
  €6.3M, led by blisce with Racine2 (Serena + makesense), 50 Partners Impact, FJ Labs and Silence VC.
