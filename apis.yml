- aid: lokki:lokki-dashboard-api
  name: Lokki Dashboard API
  description: 'The main API powering the Lokki Dashboard and Online Store: 896 operations across
    company, order, order-event, long-term-rental (LLD), online-store, products, payment, delivery,
    workshop, reconditioning, visibility and admin namespaces. Its NestJS Swagger UI and OpenAPI 3.0
    document are served unauthenticated from the production API host at /v2/api and /v2/api-json;
    every operation itself requires a JWT in the x-access-token header. Lokki does not document this
    surface as a partner product — the partner contract is the Lokki External API.'
