source: >-
  Derived by binding the live MCP tool list captured anonymously from https://docs.getlokki.com/mcp
  (verbatim in mcp/lokki-mcp-tools.json, 3 tools with real inputSchemas) against the published
  OpenAPI at openapi/lokki-external-api-openapi.json (7 operations) and the internal Swagger document
  at openapi/lokki-dashboard-api-openapi.json (896 operations).
purpose: >-
  Bind each MCP tool to the REST operation(s) that back it, so a tool is a first-class discovery unit
  with a real inputSchema. For Lokki the finding is a clean separation rather than an overlap: the MCP
  surface and the REST surface do not intersect at all. All three tools are documentation tools with no
  REST backing, and all seven partner REST operations have no tool. Nothing was mapped by guesswork.

surfaces:
