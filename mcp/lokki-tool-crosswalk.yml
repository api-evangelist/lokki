  binding_rate: 0.0
  finding: >-
    Zero overlap. Lokki's agent investment is entirely in DISCOVERY (llms.txt, an agent card, a
    provider-authored Agent Skill, a docs MCP server) and none of it is in ACTION. An agent handed
