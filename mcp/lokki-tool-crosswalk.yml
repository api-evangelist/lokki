    file: openapi/lokki-external-api-openapi.json
    operations: 7
    gated: true
    note: Contract is public; calls require a partner API key in x-api-key.
  rest_openapi_internal:
    file: openapi/lokki-dashboard-api-openapi.json
    operations: 896
    gated: true
    note: >-
      Swagger document served unauthenticated at https://prod.api.eu-west-3.lokki.rent/v2/api-json;
      operations require an x-access-token JWT. Not a partner product, so it is excluded from the
      coverage math below and listed only for completeness.
  graphql:
    endpoint: null
    note: No GraphQL surface. No /graphql path on any Lokki host, no mention in the docs or either spec.
  mcp:
    url: https://docs.getlokki.com/mcp
    gated: false
    tools: 3
    kind: documentation-only (Mintlify docs MCP)

crosswalk: []

mcp_only:
