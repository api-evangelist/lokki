source: >-
  Derived from the 4xx/5xx responses declared in openapi/lokki-external-api-openapi.json and
  openapi/lokki-dashboard-api-openapi.json, enriched from the documented failure modes at
  https://docs.getlokki.com/api-reference/authentication and Lokki's published Agent Skill
