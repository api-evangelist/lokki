openapi: 3.2.0
info:
  title: Lokki Fathom API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Fathom
paths:
  /v2/fathom/totalVisits:
    get:
      operationId: getFathomTotalVisits
      parameters:
      - name: origin
        required: false
        in: query
        schema:
          $ref: '#/components/schemas/FathomRequestOrigin'
      - name: dateFrom
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: dateTo
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: dateGrouping
        required: false
        in: query
        schema:
          enum:
          - hour
          - day
          - month
          - year
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FathomTotalVisitsDto'
      tags:
      - Fathom
  /v2/fathom/bq/aggregation:
    get:
      operationId: queryFathomAggregationBQ
