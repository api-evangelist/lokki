components:
  schemas:
    FathomTotalVisitBQDto:
      type: object
      properties:
        name:
          type: string
        visits:
          type: number
        uniques:
          type: number
        pageviews:
          type: number
        bounce_rate:
          type: number
        avg_duration:
          type: number
        date:
          format: date-time
          type: string
      required:
      - name
      - visits
      - uniques
      - pageviews
      - bounce_rate
      - avg_duration
    FathomDeviceDto:
      type: object
      properties:
        visits:
          type: string
        device:
          type: string
      required:
      - visits
      - device
    FathomTotalVisitsDto:
      type: object
      properties:
        visits:
          type: string
      required:
      - visits
    FathomReferrerHostnameDto:
      type: object
      properties:
        visits:
          type: string
        hostname:
          type: string
      required:
      - visits
      - hostname
    FathomByDeviceDto:
      type: object
      properties:
        devicesArray:
          type: array
          items:
            $ref: '#/components/schemas/FathomDeviceDto'
      required:
      - devicesArray
    FathomByHostDto:
      type: object
      properties:
        referrerHostnameArray:
          type: array
          items:
            $ref: '#/components/schemas/FathomReferrerHostnameDto'
      required:
      - referrerHostnameArray
    FathomTotalVisitsArrayDto:
      type: object
      properties:
        visitsArray:
          type: array
          items:
            $ref: '#/components/schemas/FathomTotalVisitBQDto'
      required:
      - visitsArray
    FathomByCountryDto:
      type: object
      properties:
        countryArray:
          type: array
          items:
            $ref: '#/components/schemas/FathomCountyDto'
      required:
      - countryArray
    FathomUTMDto:
      type: object
      properties:
        visits:
          type: string
        name:
          type: string
      required:
      - visits
      - name
    FathomCountyDto:
      type: object
      properties:
        visits:
          type: string
        countryCode:
          type: string
      required:
      - visits
      - countryCode
    FathomUTMsDto:
      type: object
      properties:
        UTMArray:
          type: array
          items:
            $ref: '#/components/schemas/FathomUTMDto'
      required:
      - UTMArray
    FathomRequestOrigin:
      type: string
      enum:
      - RENTAL_PLACE
      - LOKKI
  securitySchemes:
    x-access-token:
      scheme: bearer
      bearerFormat: JWT
      type: apiKey
      in: header
      name: x-access-token
