      - period
      - status
      - logistics
      - content
      - marketing
      - documents
      - surveyFiles
      - cancellation
      - createdAt
    LocalizedContent:
      type: object
      additionalProperties:
        type: string
    RentalPlaceBookingItemInsurance:
      type: object
      properties:
        enabled:
          type: boolean
        type:
          enum:
          - OPTION
          - INCLUSION
          - HIDDEN_INCLUSION
          type: string
      required:
      - enabled
      - type
    RentalPlaceBookingPriceDetails:
      type: object
      properties:
        total:
          type: number
        baseTotal:
          type: number
    RentalPlaceBookingStoreBranding:
      type: object
      properties:
        logoURL:
          type: string
        bannerUrls:
          type: array
          items:
            type: string
      required:
      - logoURL
      - bannerUrls
    RentalPlaceBookingPayments:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RentalPlaceBookingPayment'
      required:
      - items
    RentalPlaceBookingSubProductAnswer:
      type: object
      properties:
        subProductId:
          type: string
        answers:
          type: object
          additionalProperties:
            type: string
          description: Survey answers for this subProduct, keyed by fieldId.
      required:
      - subProductId
      - answers
    RentalPlaceBookingPricing:
      type: object
      properties:
        includingTaxes:
          $ref: '#/components/schemas/RentalPlaceBookingPriceDetails'
        excludingTaxes:
          $ref: '#/components/schemas/RentalPlaceBookingPriceDetails'
        deposit:
          type: number
        delivery:
          type: number
        insurance:
          type: number
        currency:
          $ref: '#/components/schemas/StoreCurrency'
      required:
      - includingTaxes
      - excludingTaxes
      - deposit
      - currency
    RentalPlaceBookingSurveyFileUrl:
      type: object
      properties:
        url:
          type: string
          description: Signed download URL valid for ~60s.
      required:
      - url
    PaymentRequestStripeInitDto:
      type: object
      properties:
        clientSecret:
          type: string
          description: Stripe PaymentIntent client_secret — passed to Stripe.js to confirm the payment.
          example: pi_3N8a1fJk2l3m4n5o_secret_6p7q8r9s0t
        paymentIntentRef:
          type: string
          description: Underlying Stripe PaymentIntent id. Useful for support/debugging.
          example: pi_3N8a1fJk2l3m4n5o
        paymentRequestId:
          type: string
          description: Echo of the PaymentRequest id this intent is attached to.
          example: 65b2f3d1b7a4e8f1a2c3d4e5
        publishableKey:
          type: string
          description: Stripe publishable key the client must pass to `loadStripe()` to mount Elements. Resolved server-side so demo/live accounts get the matching key.
          example: pk_live_...
        customerSessionClientSecret:
          type:
          - string
          - 'null'
          description: Stripe Customer Session client secret. Passed to Elements options so the PaymentElement surfaces the customer's saved PaymentMethods (e.g. the card used at checkout) for one-click confirm. Null when no Stripe Customer is attached to the request.
          example: cuss_1N8a1fJk2l3m4n5o_secret_6p7q8r9s0t
      required:
      - clientSecret
      - paymentIntentRef
      - paymentRequestId
      - publishableKey
      - customerSessionClientSecret
    PaymentRequestStateDto:
      type: object
      properties:
        id:
          type: string
          description: Stable PaymentRequest identifier — same id across retries.
          example: 65b2f3d1b7a4e8f1a2c3d4e5
        kind:
          type: string
          enum:
          - SHORT_TERM_DEPOSIT
          description: Kind of ask surfaced on the booking page (deposit, extra payment, …).
          example: SHORT_TERM_DEPOSIT
        paymentType:
          enum:
          - PAYMENT
          - SHORT_TERM_DEPOSIT
          - LONG_TERM_DEPOSIT
          - REFUND
          - SUBSCRIPTION
          - LOKKI_TRANSFER
          - LOKKI_TRANSFER_REFUND
          type: string
          description: Underlying PaymentV2 type backing the request.
          example: SHORT_TERM_DEPOSIT
        status:
          enum:
          - CANCELED
          - WAITING
          - PROCESSING
          - REQUIRES_CAPTURE
          - SUCCEEDED
          - FAILED
          type: string
          description: Current PaymentRequest status. Terminal success states for a deposit are REQUIRES_CAPTURE (pre-auth taken, captured at booking end) and SUCCEEDED.
          example: WAITING
        provider:
          enum:
          - OFFLINE
          - STRIPE
          - ANCV
          type: string
          description: Payment provider used to fulfil the request.
          example: STRIPE
        amount:
          type: number
          description: Amount to collect in the currency's smallest unit (e.g. cents for EUR).
          example: 50000
        currency:
          type: string
          description: ISO 4217 currency code of the amount.
          example: EUR
        lastFailureReason:
          type:
          - string
          - 'null'
          description: Last provider-reported failure message, if any. Null on first attempt or after success.
          example: Your card was declined.
        attempts:
          type: number
          description: Number of payment attempts already consumed on this request.
          example: 1
        maxAttempts:
          type: number
          description: Hard cap on retry attempts. The UI should disable retry once attempts == maxAttempts.
          example: 5
      required:
      - id
      - kind
      - paymentType
      - status
      - provider
      - amount
      - currency
      - lastFailureReason
      - attempts
      - maxAttempts
    RentalPlaceBookingCancellation:
      type: object
      properties:
        isCancellable:
          type: boolean
          description: True when the customer can submit a cancellation for this booking
        isAutoCancellable:
          type: boolean
          description: True when cancellation will auto-refund instead of being a request
        refundableAmount:
          type:
          - number
          - 'null'
          description: Amount that will be refunded on auto-cancellation (null when no refund applies)
        hasNonRefundablePayments:
          type: boolean
          description: True when the booking has successful non-Stripe customer payments (ANCV / offline). Those can't be refunded automatically — the UI should tell the customer to contact the merchant.
        ranges:
          description: Policy ranges — exposed for UI display of the cancellation rules
          type: array
          items:
            $ref: '#/components/schemas/StoreCancellationRange'
      required:
      - isCancellable
      - isAutoCancellable
      - refundableAmount
      - hasNonRefundablePayments
      - ranges
    RentalPlaceBookingStatus:
      type: object
      properties:
        type:
          enum:
          - ORDER
          - PRE_BOOKING
          - PRE_BOOKING_ADMIN
          - CANCELED
          type: string
        isCancelled:
          type: boolean
        isRequest:
          type: boolean
        remainingActions:
          $ref: '#/components/schemas/RentalPlaceBookingRemainingActions'
        hasPendingCancellation:
          type: boolean
          description: True when the customer sent a cancellation request not yet processed
      required:
      - type
      - isCancelled
      - isRequest
      - remainingActions
      - hasPendingCancellation
    RentalPlaceBookingsByStatusGetDto:
      type: object
      properties:
        bookings:
          $ref: '#/components/schemas/RentalPlaceBookingsByStatus'
        count:
          $ref: '#/components/schemas/RentalPlaceBookingsCount'
      required:
      - bookings
      - count
  securitySchemes:
    x-access-token:
      scheme: bearer
      bearerFormat: JWT
      type: apiKey
      in: header
      name: x-access-token
