openapi: 3.2.0
info:
  title: Lokki Skiset API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Skiset
paths:
  /v2/skiset/checkCanceled/{orderId}:
    get:
      operationId: checkSkisetOrderCanceled
      parameters:
      - name: orderId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: boolean
      tags:
      - Skiset
  /v2/skiset/setId:
    post:
      operationId: setSkisetId
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetSkisetIdDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Company'
      tags:
      - Skiset
  /v2/skiset/loadPacksFromAPI:
    post:
      operationId: loadPacksFromSkisetAPI
      parameters: []
      responses:
        '201':
          description: ''
      tags:
      - Skiset
components:
  schemas:
    OpeningTimeFrame:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          - ALL
        isOpen:
          type: boolean
        from:
          type: string
        to:
          type: string
      required:
      - id
      - day
      - isOpen
    MultipleFundsTransfer:
      type: object
      properties:
        activated:
          type: boolean
        isFree:
          type: boolean
        transferDays:
          type: array
          items:
            type: number
        activatedDate:
          format: date-time
          type: string
      required:
      - activated
    PartPayment:
      type: object
      properties:
        isActive:
          type: boolean
        percentage:
          type: number
      required:
      - isActive
      - percentage
    CompanyRentalPlaceDescriptionsDto:
      type: object
      properties:
        fr:
          type: string
        en:
          type: string
      required:
      - fr
      - en
    DeliveryRangeSpecificPrice:
      type: object
      properties:
        price:
          type: number
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDeliveryCity'
      required:
      - price
      - cities
    DeliveryRange:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        price:
          type: number
        specificPrices:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryRangeSpecificPrice'
      required:
      - min
      - max
      - price
      - specificPrices
    PeriodicDiscount:
      type: object
      properties:
        _id:
          type: string
        discountInPercentage:
          type: number
        startDate:
          format: date-time
          type:
          - string
          - 'null'
        endDate:
          format: date-time
          type:
          - string
          - 'null'
        applicableDate:
          enum:
          - CREATED_DATE
          - START_DATE
          type: string
        scope:
          default:
          - ONLINE_STORE
          type: array
          items:
            type: string
            enum:
            - ONLINE_STORE
            - DASHBOARD
      required:
      - _id
      - discountInPercentage
      - startDate
      - endDate
      - applicableDate
    CompanyBailMaxAmount:
      type: object
      properties:
        activated:
          type: boolean
        maxAmount:
          type: number
      required:
      - activated
      - maxAmount
    CompanyRentalPlaceTeamDto:
      type: object
      properties:
        descriptions:
          $ref: '#/components/schemas/CompanyRentalPlaceDescriptionsDto'
        image:
          type: string
        video:
          type: string
        teamName:
          type: string
      required:
      - descriptions
      - image
      - video
      - teamName
    CompanyCategoryDiscount:
      type: object
      properties:
        categoryIds:
          type: array
          items:
            type: string
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/CompanyCategoryDiscountRange'
      required:
      - categoryIds
      - ranges
    ProductStateInfo:
      type: object
      properties:
        name:
          type: string
        displayGeneralConditions:
          type: boolean
        legalNotices:
          type: string
        numberCreated:
          type: number
        useLegalCompanyInfo:
          type: boolean
      required:
      - name
      - displayGeneralConditions
      - legalNotices
      - numberCreated
      - useLegalCompanyInfo
    CompanyAdyenCredentials:
      type: object
      properties:
        provider:
          type: string
          default: adyen
          enum:
          - adyen
        apiKey:
          type: string
        merchantAccount:
          type: string
        clientKey:
          type: string
        liveEndpointUrlPrefix:
          type: string
        store:
          type: string
      required:
      - provider
      - apiKey
      - merchantAccount
      - clientKey
      - liveEndpointUrlPrefix
      - store
    CompanyAddressComponentsDto:
      type: object
      properties:
        streetNumber:
          type: string
        street:
          type: string
        postalCode:
          type: string
        city:
          type: string
        administrativeAreaLevel1:
          type: string
        administrativeAreaLevel2:
          type: string
        country:
          type: string
        placeId:
          type: string
      required:
      - streetNumber
      - street
      - postalCode
      - city
      - administrativeAreaLevel1
      - administrativeAreaLevel2
      - country
      - placeId
    CompanyMailSender:
      type: object
      properties:
        name:
          type: string
        replyToEmailAddress:
          type: string
      required:
      - name
      - replyToEmailAddress
    LPTermConditionV0102:
      type: object
      properties:
        date:
          format: date-time
          type: string
        fee:
          $ref: '#/components/schemas/CompanyGlobalFee'
      required:
      - date
      - fee
    CompanyCsSupportRequested:
      type: object
      properties:
        requested:
          type: boolean
        requestedAt:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - requested
      - requestedAt
    CompanySkisetInfos:
      type: object
      properties:
        id:
          type: number
        trademark:
          type: string
        resort_id:
          type: number
        country_id:
          type: number
        member_id:
          type: number
        name:
          type: string
        member:
          type: string
        city:
          type: string
        country:
          type: string
      required:
      - id
      - trademark
      - resort_id
      - country_id
      - member_id
      - name
      - member
      - city
      - country
    CompanyDelivery:
      type: object
      properties:
        activated:
          type: boolean
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryRange'
        deliveryOnly:
          type: boolean
        returnDelivery:
          type: boolean
        freeDeliveryActivated:
          type: boolean
        freeDeliveryMinimumType:
          type: string
          enum:
          - MINUTES
          - SUBTOTAL
        freeDeliveryMinimumVal:
          type: number
        excludedCities:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDeliveryCity'
      required:
      - activated
      - ranges
      - deliveryOnly
      - returnDelivery
      - freeDeliveryActivated
      - freeDeliveryMinimumType
      - freeDeliveryMinimumVal
      - excludedCities
    CompanyRentalPlaceUniversesDto:
      type: object
      properties:
        id:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        pack:
          type: boolean
      required:
      - id
      - categoryIds
      - pack
    CompanyOrderReminder:
      type: object
      properties:
        emailOneDayBeforeOrderStart:
          type: boolean
        emailTemplateId:
          type:
          - string
          - 'null'
        bailLinkInEmail:
          type: boolean
        emailOneDayBeforeOrderEnd:
          type: boolean
        emailOnLokkiPayment:
          type: boolean
        emailOnFundsTransfer:
          type: boolean
        oneDayBeforeOrderEndEmailTemplateId:
          type:
          - string
          - 'null'
      required:
      - emailOneDayBeforeOrderStart
      - emailTemplateId
      - bailLinkInEmail
      - emailOneDayBeforeOrderEnd
      - emailOnLokkiPayment
      - emailOnFundsTransfer
      - oneDayBeforeOrderEndEmailTemplateId
    CompanyFeePayment:
      type: object
      properties:
        percentage:
          type: number
        amount:
          type: number
      required:
      - percentage
      - amount
    CompanyOnboarding:
      type: object
      properties:
        startDate:
          format: date-time
          type: string
        endDate:
          format: date-time
          type: string
        visibility:
          type: boolean
    LocalizedReview:
      type: object
      properties:
        reviews:
          type: array
          items:
            $ref: '#/components/schemas/GoogleReview'
        fetchedAt:
          format: date-time
          type: string
      required:
      - reviews
    EventUniverse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
      required:
      - id
      - name
      - imageUrl
    CompanyRentalPlaceDto:
      type: object
      properties:
        image:
          type: string
        additionalImages:
          type: array
          items:
            type: string
        descriptions:
          $ref: '#/components/schemas/CompanyRentalPlaceDescriptionsDto'
        universes:
          type: array
          items:
            $ref: '#/components/schemas/CompanyRentalPlaceUniversesDto'
        verticales:
          type: array
          items:
            type: string
            enum:
            - BIKE
            - ELECTRIC_BIKE
            - MOPED
            - MOTORCYCLE
            - CAR
            - SCOOTER
            - SKI
            - CLIMBING
            - SNOWSHOES
            - SURF
            - PADDLE
            - CANOE_KAYAK
            - BOAT
            - EVENT
            - MOTOCULTURE
            - TOOLING
        showcaseProducts:
          type: array
          items:
            $ref: '#/components/schemas/CompanyShowcaseProductDto'
        team:
          $ref: '#/components/schemas/CompanyRentalPlaceTeamDto'
        lokkiComment:
          type: string
      required:
      - image
      - additionalImages
      - descriptions
      - universes
      - verticales
      - showcaseProducts
      - team
      - lokkiComment
    CompanyOnlineStoreSlot:
      type: object
      properties:
        hours:
          type: number
        minutes:
          type: number
        label:
          type: string
        id:
          type: string
      required:
      - hours
      - minutes
      - label
      - id
    CancellationPolicyDto:
      type: object
      properties:
        activated:
          type: boolean
        onlineRequests:
          type: boolean
        automaticRefunds:
          type: boolean
        policyType:
          enum:
          - FLEXIBLE
          - MODERATE
          - STRICT
          - CUSTOM
          type: string
        lastMinuteThreshold:
          type: number
          minimum: 0
        inAdvanceThreshold:
          type: number
          minimum: 0
        lowRefundRate:
          type: number
          minimum: 0
          maximum: 100
        midRefundRate:
          type: number
          minimum: 0
          maximum: 100
        highRefundRate:
          type: number
          minimum: 0
          maximum: 100
      required:
      - activated
      - onlineRequests
      - automaticRefunds
      - policyType
      - lastMinuteThreshold
      - inAdvanceThreshold
      - lowRefundRate
      - midRefundRate
      - highRefundRate
    Company:
      type: object
      properties:
        addressComponents:
          $ref: '#/components/schemas/CompanyAddressComponentsDto'
        addressComponentsMachine:
          $ref: '#/components/schemas/CompanyAddressComponentsDto'
        paymentProvider:
          oneOf:
          - $ref: '#/components/schemas/CompanyAdyenCredentials'
          - $ref: '#/components/schemas/CompanyStripeCredentials'
        paymentProviderEvent:
          oneOf:
          - $ref: '#/components/schemas/CompanyAdyenCredentials'
          - $ref: '#/components/schemas/CompanyStripeCredentials'
        id:
          type: string
        slug:
          type: string
        redirectSlugs:
          type: array
          items:
            type: string
        name:
          type: string
        description:
          type: string
        address:
          type: string
        addressLatitude:
          type: string
        addressLongitude:
          type: string
        logoURL:
          type: string
        vat:
          type: number
        vatName:
          type: string
        vatWorkshop:
          type: number
        hyperlineTaxRate:
          type: number
        generalConditions:
          $ref: '#/components/schemas/LocalizedContent'
        generalConditionsLLD:
          $ref: '#/components/schemas/LocalizedContent'
        cancellationPolicy:
          $ref: '#/components/schemas/CancellationPolicyDto'
        newsletterSubscription:
          type: boolean
        onlineStoreConfig:
          $ref: '#/components/schemas/OnlineStoreConfig'
        isGeneralConditionsLCDModified:
          type: boolean
        isDemo:
          type: boolean
        accountStatus:
          enum:
          - ACTIVE
          - DEMO
          - TRIAL
          - ARCHIVED
          type: string
        accountType:
          enum:
          - PLATFORM
          - VISIBILITY_ONE
          type: string
        calendarView:
          type: string
        user:
          $ref: '#/components/schemas/CompanyUser'
        phoneNumber:
          type: string
        companyMailSender:
          $ref: '#/components/schemas/CompanyMailSender'
        companyAccess:
          $ref: '#/components/schemas/CompanyAccess'
        siret:
          type: string
        legalName:
          type: string
        headquartersAddress:
          type: string
        companyBailMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        companyBailEventMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        companyBailLLDMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        internalCompanyBailMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        internalCompanyBailEventMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        internalCompanyBailLLDMaxAmount:
          $ref: '#/components/schemas/CompanyBailMaxAmount'
        group:
          type: string
        companyCurrency:
          $ref: '#/components/schemas/CompanyCurrency'
        timezone:
          type: string
        companyOpinionBooster:
          $ref: '#/components/schemas/CompanyOpinionBooster'
        orderReminder:
          $ref: '#/components/schemas/CompanyOrderReminder'
        rentalPoints:
          type: array
          items:
            $ref: '#/components/schemas/RentalPoint'
        workshopLocations:
          type: array
          items:
            $ref: '#/components/schemas/WorkshopLocation'
        onlineStoreRentalPointType:
          enum:
          - SAME
          - DIFFERENT
          type: string
        partPayment:
          $ref: '#/components/schemas/PartPayment'
        partPaymentEvent:
          $ref: '#/components/schemas/PartPayment'
        onlineStoreSlots:
          type: array
          items:
            $ref: '#/components/schemas/CompanyOnlineStoreSlot'
        timeProductsUnavailableAfterOrder:
          type: string
        dayProductsUnavailableAfterOrder:
          type: number
        dayType:
          enum:
          - full-24h
          - opening-hours
          type: string
        timeProductsUnavailableBeforeOrder:
          type: string
        dayProductsUnavailableBeforeOrder:
          type: number
        magicSchedule:
          type: boolean
        enableQrCode:
          type: boolean
        templateEmailIdOnlineStore:
          type: string
        rentalPlaceInfos:
          $ref: '#/components/schemas/CompanyRentalPlaceDto'
        tulipSettings:
          $ref: '#/components/schemas/TulipSettings'
        ancvConnectSettings:
          $ref: '#/components/schemas/AncvConnectSettings'
        productStateInfo:
          $ref: '#/components/schemas/ProductStateInfo'
        eventCgu:
          $ref: '#/components/schemas/LocalizedContent'
        documentCustomFields:
          $ref: '#/components/schemas/CompanyDocumentCustomFieldsDto'
        categoryDiscounts:
          type: array
          items:
            $ref: '#/components/schemas/CompanyCategoryDiscount'
        isArchived:
          type: boolean
        hasRentalPlaceOrder:
          type: boolean
        lifecycleEvents:
          $ref: '#/components/schemas/CompanyLifecycleEvents'
        csInfos:
          $ref: '#/components/schemas/CompanyCsInfos'
        squareCredentials:
          allOf:
          - $ref: '#/components/schemas/SquareCredentials'
        googleRating:
          $ref: '#/components/schemas/GoogleRating'
        responseDuration:
          $ref: '#/components/schemas/CompanyResponseDuration'
        openTime:
          type: string
        closeTime:
          type: string
        skisetInfos:
          $ref: '#/components/schemas/CompanySkisetInfos'
        createdAt:
          format: date-time
          type: string
        documentColor:
          type: string
        quickOrderDefaultMode:
          $ref: '#/components/schemas/CompanyDefaultQuickOrderMode'
        automaticInternalStartDateAttribution:
          type: boolean
        socialMedia:
          $ref: '#/components/schemas/SocialMedia'
        offlinePin:
          type: string
        internalPaymentMethods:
          $ref: '#/components/schemas/LokkiPaymentMethods'
        onlineStorePaymentMethods:
          $ref: '#/components/schemas/LokkiPaymentMethods'
        lokkiPaymentTermsConditionsHistory:
          $ref: '#/components/schemas/LokkiPaymentTermsConditionsHistory'
        fee:
          $ref: '#/components/schemas/CompanyGlobalFee'
        proposedRentalPlaceCommission:
          $ref: '#/components/schemas/ProposedRentalPlaceCommission'
        trialInfos:
          $ref: '#/components/schemas/CompanyTrialInfos'
        marketing:
          $ref: '#/components/schemas/MarketingSettings'
        periodicDiscounts:
          type: array
          items:
            $ref: '#/components/schemas/PeriodicDiscount'
        hasOrders:
          type: boolean
      required:
      - id
      - slug
      - redirectSlugs
      - name
      - description
      - address
      - addressLatitude
      - addressLongitude
      - logoURL
      - vat
      - vatName
      - vatWorkshop
      - hyperlineTaxRate
      - generalConditions
      - generalConditionsLLD
      - cancellationPolicy
      - newsletterSubscription
      - onlineStoreConfig
      - isDemo
      - accountStatus
      - accountType
      - calendarView
      - user
      - phoneNumber
      - companyMailSender
      - companyAccess
      - siret
      - legalName
      - headquartersAddress
      - companyBailMaxAmount
      - companyBailEventMaxAmount
      - companyBailLLDMaxAmount
      - internalCompanyBailMaxAmount
      - internalCompanyBailEventMaxAmount
      - internalCompanyBailLLDMaxAmount
      - group
      - companyCurrency
      - timezone
      - companyOpinionBooster
      - orderReminder
      - rentalPoints
      - workshopLocations
      - onlineStoreRentalPointType
      - partPayment
      - partPaymentEvent
      - onlineStoreSlots
      - timeProductsUnavailableAfterOrder
      - dayProductsUnavailableAfterOrder
      - timeProductsUnavailableBeforeOrder
      - dayProductsUnavailableBeforeOrder
      - magicSchedule
      - enableQrCode
      - templateEmailIdOnlineStore
      - rentalPlaceInfos
      - tulipSettings
      - ancvConnectSettings
      - productStateInfo
      - eventCgu
      - documentCustomFields
      - categoryDiscounts
      - isArchived
      - squareCredentials
      - openTime
      - closeTime
      - createdAt
      - documentColor
      - quickOrderDefaultMode
      - automaticInternalStartDateAttribution
      - socialMedia
      - lokkiPaymentTermsConditionsHistory
      - fee
    MarketingSettings:
      type: object
      properties:
        trackers:
          $ref: '#/components/schemas/Trackers'
      required:
      - trackers
    SelfTestUtmInfos:
      type: object
      properties:
        utm_source:
          type: string
        utm_medium:
          type: string
        utm_campaign:
          type: string
        utm_content:
          type: string
        utm_term:
          type: string
        device:
          type: string
        matchtype:
          type: string
        campaign_id:
          type: string
        adset_id:
          type: string
        ad_id:
          type: string
        GeoLoc:
          type: string
    CompanyLifecycleEvents:
      type: object
      properties:
        catalogMarkedCompleteAt:
          format: date-time
          type: string
    WorkshopLocation:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        city:
          type: string
        country:
          type: string
        address:
          type: string
        zipcode:
          type: string
      required:
      - id
      - name
      - city
      - country
      - address
      - zipcode
    AncvConnectSettings:
      type: object
      properties:
        activated:
          type: boolean
        shopId:
          type:
          - string
          - 'null'
      required:
      - activated
      - shopId
    CompanyDefaultQuickOrderMode:
      type: object
      properties:
        booking:
          type: string
          enum:
          - QR_SCANNING
          - MANUAL
        bookingUpdate:
          type: string
          enum:
          - QR_SCANNING
          - MANUAL
        readyToGo:
          type: string
          enum:
          - QR_SCANNING
          - MANUAL
        return:
          type: string
          enum:
          - QR_SCANNING
          - MANUAL
        exchange:
          type: string
          enum:
          - QR_SCANNING
          - MANUAL
        showDelivery:
          type: boolean
        showSurvey:
          type: boolean
        showUnavailability:
          type: boolean
        showUnavailabilityOnUpdate:
          type: boolean
      required:
      - booking
      - bookingUpdate
      - readyToGo
      - return
      - exchange
      - showDelivery
      - showSurvey
      - showUnavailability
      - showUnavailabilityOnUpdate
    RentalPlaceNetworkUpdatedBy:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
      required:
      - id
      - name
    CompanyUser:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        id:
          type: string
        lastConnected:
          format: date-time
          type: string
        connectionDates:
          type: array
          items:
            format: date-time
            type: string
        isAccountActivated:
          type: boolean
        role:
          type: string
        signedUpWith:
          type: string
          enum:
          - google
          - apple
      required:
      - name
      - email
      - id
    CompanyShowcaseProductDto:
      type: object
      properties:
        id:
          type: string
        price:
          type: number
      required:
      - id
      - price
    DateRange:
      type: object
      properties:
        id:
          type: string
        from:
          type: string
        to:
          type: string
      required:
      - id
      - from
      - to
    CompanyHyperlineSubscriptionData:
      type: object
      properties:
        isPaidByThirdParty:
          type: boolean
        customerId:
          type: string
        subscriptionId:
          type: string
        usageCustomerId:
          type:
          - string
          - 'null'
        usageSubscriptionId:
          type:
          - string
          - 'null'
        subscriptionCheckoutStatus:
          type:
          - string
          - 'null'
          enum:
          - PENDING
          - COMPLETED
          - FAILED
      required:
      - isPaidByThirdParty
      - customerId
      - subscriptionId
      - usageCustomerId
      - usageSubscriptionId
      - subscriptionCheckoutStatus
    CompanyGlobalFee:
      type: object
      properties:
        rentalPlace:
          $ref: '#/components/schemas/CompanyFee'
        global:
          $ref: '#/components/schemas/CompanyFee'
        lld:
          $ref: '#/components/schemas/CompanyFee'
      required:
      - rentalPlace
      - global
      - lld
    ReservationRanges:
      type: object
      properties:
        minimum:
          $ref: '#/components/schemas/ReservationRange'
        maximum:
          $ref: '#/components/schemas/ReservationRange'
      required:
      - minimum
      - maximum
    ProposedRentalPlaceCommission:
      type: object
      properties:
        commissionRate:
          type: number
        requiresSignature:
          type: boolean
        batchDate:
          type: string
      required:
      - commissionRate
      - requiresSignature
      - batchDate
    CompanyStripeCredentials:
      type: object
      properties:
        provider:
          type: string
          default: stripe
          enum:
          - stripe
        account:
          type: string
        type:
          enum:
          - EXPRESS
          - STANDARD
          type: string
        status:
          enum:
          - ONBOARDING
          - ACTIVE
          type: string
