components:
  schemas:
    CreateDocumentOrderDto:
      type: object
      properties:
        orderId:
          type: string
        documentModelId:
          type:
          - string
          - 'null'
        documentComment:
          type: string
        lang:
          type: string
          enum:
          - fr
          - en
          - es
          - pt
          - it
          - pl
          - de
          - nl
        signed:
          type: boolean
        generatedViaQuickOrder:
          type: boolean
      required:
      - orderId
      - documentModelId
      - documentComment
      - lang
      - signed
    HistoryInspectionField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInspectionAnswer'
      required:
      - id
      - name
      - answers
    SendPaymentReceiptDto:
      type: object
      properties:
        paymentIntentId:
          type: string
      required:
      - paymentIntentId
    OfflinePayment:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OfflinePaymentProvider'
        method:
          enum:
          - CARD
          - CASH
          - CHECK
          - CHECK_VACANCES
          - TRANSFER
          - SQUARE_TERMINAL
          - OTHER
          type: string
        refundedPaymentId:
          type: string
        refundReason:
          enum:
          - DUPLICATE
          - FRAUDULENT
          - REQUESTED_BY_CUSTOMER
          - OTHER
          type: string
      required:
      - type
      - method
    PromoCodeCreateOrderDto:
      type: object
      properties:
        code:
          type: string
        source:
          type: string
          enum:
          - COMPANY
          - LOKKI
        discountAmount:
          type: number
        discountType:
          type: string
        applyOnDelivery:
          type: boolean
        limitToNewCustomers:
          type: boolean
        limitToVerticales:
          type: array
          items:
            type: string
        limitToCompanies:
          type: array
          items:
            type: string
        appliedDiscountAmount:
          type: number
      required:
      - code
      - source
      - discountAmount
      - discountType
      - applyOnDelivery
    OrderMessageAutoCancel:
      type: object
      properties:
        type:
          type: string
          default: AUTO_CANCEL
          enum:
          - AUTO_CANCEL
        message:
          type: string
        id:
          type: string
        date:
          format: date-time
          type: string
        solved:
          type: boolean
      required:
      - type
      - message
      - id
      - date
      - solved
    CreateAgencyOrderBodyDto:
      type: object
      properties:
        companyId:
          type: string
          description: Company the hidden quote is created for. Explicit because the admin acts on behalf of any renter — there is no renter JWT to read a companyId from in this flow.
        startDate:
          type: string
          format: date-time
        endDate:
          type: string
          format: date-time
        customer:
          $ref: '#/components/schemas/AgencyOrderCustomerDto'
        lines:
          description: Requested products. Everything else (price, VAT, deposit, survey, sub-product allocation) is resolved server-side from the renter catalogue — an admin JWT cannot read it.
          type: array
          items:
            $ref: '#/components/schemas/AgencyOrderLineDto'
        discount:
          type: number
          minimum: 0
          description: Absolute discount to grant on the quote total, in the company currency. Converted server-side into the percentage `order.discount` the rest of the platform expects.
        remark:
          type: string
        quoteRequestId:
          type: string
          description: Quote request the customer info was autofilled from in step 1 of the funnel
      required:
      - companyId
      - startDate
      - endDate
      - customer
      - lines
    ShifterInfo:
      type: object
      properties:
        shifterId:
          type: string
        status:
          type: string
          enum:
          - IMPORTED
          - TO_IMPORT
          - NONE
        importedDate:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - shifterId
      - status
      - importedDate
    GenerateNewStateDocumentDto:
      type: object
      properties:
        orderId:
          type: string
        scope:
          enum:
          - DEPART
          - RETOUR
          type: string
        generateStateSubProducts:
          type: array
          items:
            $ref: '#/components/schemas/GenerateNewStateSubProductDto'
        lang:
          enum:
          - fr
          - en
          - es
          - pt
          - it
          - pl
          - de
          - nl
          type: string
      required:
      - orderId
      - scope
      - generateStateSubProducts
      - lang
    ServiceCreateUpdateOrderDto:
      type: object
      properties:
        id:
          type: string
        numberSelected:
          type: number
        name:
          type: string
        rentalType:
          type: string
          enum:
          - LCD
          - LLD
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        onlineStoreDescription:
          $ref: '#/components/schemas/LocalizedContent'
        price:
          type: number
        isAssuranceTulip:
          type: boolean
        priceLabelToDisplay:
          type: string
        serviceImage:
          type: array
          items:
            type: string
        vat:
          type: number
        initialUnitPrice:
          type: number
        discount:
          $ref: '#/components/schemas/ItemDiscount'
        surveyId:
          type: string
        answers:
          type: object
      required:
      - id
      - numberSelected
      - name
      - rentalType
      - onlineStoreName
      - onlineStoreDescription
      - price
      - isAssuranceTulip
      - priceLabelToDisplay
      - serviceImage
      - vat
      - initialUnitPrice
      - discount
      - answers
    TulipInfos:
      type: object
      properties:
        address:
          type: string
