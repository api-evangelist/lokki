components:
  schemas:
    CustomerOrderEventDto:
      type: object
      properties:
        _id:
          type: string
        lastName:
          type: string
        firstName:
          type: string
        phone:
          type: string
        email:
          type: string
        zipCode:
          type: string
        companyName:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/CustomerFieldsDto'
        isNewsletterSubscribe:
          type: boolean
        isLokkiNewsletterSubscribe:
          type: boolean
        customerImage:
          type: string
        customerRpId:
          type: string
      required:
      - _id
      - lastName
      - firstName
      - phone
      - email
      - zipCode
      - companyName
      - fields
      - isNewsletterSubscribe
      - isLokkiNewsletterSubscribe
      - customerImage
    HistoryInspectionField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInspectionAnswer'
      required:
      - id
      - name
      - answers
    ReservationInfosDto:
      type: object
      properties:
        id:
          type:
          - string
          - 'null'
        status:
          type: array
          items:
            $ref: '#/components/schemas/OrderStatusDto'
        priceOverrides:
          type: array
          items:
            $ref: '#/components/schemas/PriceOverrideDto'
        discount:
          type: number
        infos:
          type: string
        label:
          type: string
        color:
          type: string
        promoCode:
          allOf:
          - $ref: '#/components/schemas/PromoCodeDto'
        attachedFiles:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
      required:
      - id
      - status
      - priceOverrides
      - discount
      - infos
      - label
      - color
    CreateTerminalCheckoutDto:
      type: object
      properties:
        orderId:
          type: string
        amount:
          type: number
        deviceId:
          type: string
      required:
      - orderId
      - amount
      - deviceId
    DocumentByOrderEvent:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        customerName:
          type: string
        documentModelId:
          type: string
        createdDate:
          format: date-time
          type: string
        isEmailSend:
          type: boolean
        isSigned:
          type: boolean
        key:
          type: string
        orderEventId:
          type: string
        orderEventStartDate:
          format: date-time
          type: string
        orderEventEndDate:
          format: date-time
          type: string
        orderEventUpdatedAt:
          format: date-time
          type: string
      required:
      - id
      - name
      - customerName
      - documentModelId
      - createdDate
      - isEmailSend
      - isSigned
      - key
      - orderEventId
      - orderEventStartDate
      - orderEventEndDate
      - orderEventUpdatedAt
    CreateSquarePaymentDto:
      type: object
      properties:
        paymentId:
          type: string
        orderEventId:
          type: string
      required:
      - paymentId
      - orderEventId
    ShifterInfo:
      type: object
      properties:
        shifterId:
          type: string
        status:
          type: string
          enum:
          - IMPORTED
          - TO_IMPORT
          - NONE
        importedDate:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - shifterId
      - status
      - importedDate
