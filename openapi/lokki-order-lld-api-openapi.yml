components:
  schemas:
    OfflinePayment:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OfflinePaymentProvider'
        method:
          enum:
          - CARD
          - CASH
          - CHECK
          - CHECK_VACANCES
          - TRANSFER
          - SQUARE_TERMINAL
          - OTHER
          type: string
        refundedPaymentId:
          type: string
        refundReason:
          enum:
          - DUPLICATE
          - FRAUDULENT
          - REQUESTED_BY_CUSTOMER
          - OTHER
          type: string
      required:
      - type
      - method
    PromoCodeCreateOrderDto:
      type: object
      properties:
        code:
          type: string
        source:
          type: string
          enum:
          - COMPANY
          - LOKKI
        discountAmount:
          type: number
        discountType:
          type: string
        applyOnDelivery:
          type: boolean
        limitToNewCustomers:
          type: boolean
        limitToVerticales:
          type: array
          items:
            type: string
        limitToCompanies:
          type: array
          items:
            type: string
        appliedDiscountAmount:
          type: number
      required:
      - code
      - source
      - discountAmount
      - discountType
      - applyOnDelivery
    OrderMessageAutoCancel:
      type: object
      properties:
        type:
          type: string
          default: AUTO_CANCEL
          enum:
          - AUTO_CANCEL
        message:
          type: string
        id:
          type: string
        date:
          format: date-time
          type: string
        solved:
          type: boolean
      required:
      - type
      - message
      - id
      - date
      - solved
    RecoverLldPaymentFromStripeDto:
      type: object
      properties:
        paymentIntentId:
          type: string
      required:
      - paymentIntentId
    ShifterInfo:
      type: object
      properties:
        shifterId:
          type: string
        status:
          type: string
          enum:
          - IMPORTED
          - TO_IMPORT
          - NONE
        importedDate:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - shifterId
      - status
      - importedDate
    ServiceCreateUpdateOrderDto:
      type: object
      properties:
        id:
          type: string
        numberSelected:
          type: number
        name:
          type: string
        rentalType:
          type: string
          enum:
          - LCD
          - LLD
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        onlineStoreDescription:
          $ref: '#/components/schemas/LocalizedContent'
        price:
          type: number
        isAssuranceTulip:
          type: boolean
        priceLabelToDisplay:
          type: string
        serviceImage:
          type: array
          items:
            type: string
        vat:
          type: number
        initialUnitPrice:
          type: number
        discount:
          $ref: '#/components/schemas/ItemDiscount'
        surveyId:
          type: string
        answers:
          type: object
      required:
      - id
      - numberSelected
      - name
      - rentalType
      - onlineStoreName
      - onlineStoreDescription
      - price
      - isAssuranceTulip
      - priceLabelToDisplay
      - serviceImage
      - vat
      - initialUnitPrice
      - discount
      - answers
    TulipInfos:
      type: object
      properties:
        address:
          type: string
        zipcode:
          type: string
        city:
          type: string
        managerFirstName:
          type: string
        managerLastName:
          type: string
        sirenNumber:
          type: string
      required:
      - address
      - zipcode
      - city
      - managerFirstName
      - managerLastName
      - sirenNumber
    PaymentSquareRef:
      type: object
      properties:
        squarePaymentId:
          type: string
        squareOrderId:
          type: string
      required:
      - squarePaymentId
      - squareOrderId
    PackCategoryCreateOrderDto:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
    StripePaymentLongTermDepositType:
      type: string
      enum:
      - LONG_TERM_DEPOSIT
    ProductPriceRule:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        rules:
          type: array
          items:
            $ref: '#/components/schemas/PriceRule'
      required:
      - id
      - title
      - rules
    OrderRef:
      type: object
      properties:
        id:
          type: string
        startDate:
          format: date-time
          type: string
        endDate:
          format: date-time
          type: string
        totalTTC:
          type: number
        totalHT:
          type: number
        createdFrom:
          type: string
          enum:
          - DASHBOARD
          - QUICK_ORDER
          - ONLINE_STORE
          - RENTAL_PLACE_B2B
          - RENTAL_PLACE_LOKKI
          - BORNE
          - SKISET
          - SKIMIUM
          - UNKNOWN
          - TEST
          - ADMIN_IMPORT
      required:
      - id
      - startDate
      - endDate
      - totalTTC
      - totalHT
      - createdFrom
    PriceRuleVariation:
      type: object
      properties:
        rule:
          allOf:
          - $ref: '#/components/schemas/ProductPriceRule'
        deltaAmount:
          type: number
        price:
          type: number
      required:
      - rule
      - deltaAmount
      - price
    DocumentState:
      type: object
      properties:
        createdDate:
          format: date-time
          type: string
        documentId:
          type: string
        isEmailSend:
          type: boolean
        isSigned:
          type: boolean
        key:
          type: string
        name:
          type: string
        events:
          type: array
          items:
            $ref: '#/components/schemas/DocumentStateEvent'
        status:
          type: string
          enum:
