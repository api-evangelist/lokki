          - SUCCESS
        pdfMonkeyDocumentId:
          type: string
        scope:
          type: string
          enum:
          - DEPART
          - RETOUR
      required:
      - createdDate
      - documentId
      - isEmailSend
      - isSigned
      - key
      - name
      - events
    OrderSubProduct:
