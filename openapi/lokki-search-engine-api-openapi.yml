    SearchEngineSuggestCategoryDto:
      type: object
      properties:
        type:
          example: verticale
          $ref: '#/components/schemas/SuggestCategoryType'
        key:
          type: string
          description: Canonical key of this (possibly merged) entry — the verticale key (CompanyVerticale) or a representative sub-category key, depending on `type`. The front maps it to an icon.
          example: MOTORCYCLE
        keys:
          description: 'Every underlying key this entry represents: verticale keys for `verticale`, sub-category ids for `subCategory`. Usually `[key]`, but mirrored verticales are merged into one entry (e.g. Bike + Electric Bike → `keys: [''BIKE'', ''ELECTRIC_BIKE'']`), so the front applies all of them on selection and filters both.'
          example:
          - MOTORCYCLE
          type: array
          items:
            type: string
        label:
          type:
          - string
          - 'null'
          description: Localized label resolved to the requested language, or null when no label is denormalized (front falls back to mapping the key).
          example: Moto
        count:
          type: number
          description: Number of matched items catalog-wide in this verticale/sub-category (drives ordering; not a local availability count).
          example: 12
      required:
      - type
      - key
      - keys
      - label
      - count
