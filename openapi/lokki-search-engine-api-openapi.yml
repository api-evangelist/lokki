    SearchEngineSuggestItemDto:
      type: object
      properties:
        externalId:
          type: string
          description: Item identifier (product/service/pack) used to build the click-through link.
          example: 6634f1c2a1b2c3d4e5f60789
        name:
          type: string
          description: Item name resolved to the requested language (French fallback).
          example: Honda NX500 A2
        image:
