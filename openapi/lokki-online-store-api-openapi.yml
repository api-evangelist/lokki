openapi: 3.2.0
info:
  title: Lokki Online Store API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Online Store
paths:
  /v2/online-store/cart/{slug}:
    get:
      operationId: getOnlineStoreCart
      parameters:
      - name: slug
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartDto'
      tags:
      - Online Store
  /v2/online-store/cart:
    post:
      operationId: setOnlineStoreCart
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CartDto'
      responses:
        '201':
          description: ''
          content:
