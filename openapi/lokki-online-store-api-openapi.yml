components:
  schemas:
    OnlineStoreServiceDto:
      type: object
      properties:
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        type:
          type: string
          default: service
          enum:
          - service
        category:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OnlineStoreProductTags'
        isRelatedProducts:
          type: boolean
        relatedProducts:
          type: array
          items:
            type: string
        hideOnOnlineStore:
          type: boolean
        isAssuranceTulip:
          type: boolean
        productModel:
          type: string
        rentalType:
          enum:
          - LCD
          - LLD
          type: string
        id:
          type: string
        name:
          type: string
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        price:
          type: number
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        attachedFiles:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        description:
          $ref: '#/components/schemas/LocalizedContent'
        rank:
          type: number
        productSurveyId:
          type: string
        vat:
          type: number
      required:
      - type
      - category
      - tags
      - isRelatedProducts
      - relatedProducts
      - hideOnOnlineStore
      - isAssuranceTulip
      - productModel
      - rentalType
      - id
      - name
      - onlineStoreName
      - price
      - imageUrl
      - videoLink
      - attachedFiles
      - description
      - rank
      - productSurveyId
      - vat
    ProductSurveyField:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
        type:
          type: string
          enum:
          - TEXT
          - SELECT
          - MULTIPLE_SELECT
          - DOCUMENT
        selectAnswers:
          type: array
          items:
            type: string
      required:
      - id
      - value
      - type
      - selectAnswers
    OfflinePayment:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/OfflinePaymentProvider'
        method:
          enum:
          - CARD
          - CASH
          - CHECK
          - CHECK_VACANCES
          - TRANSFER
          - SQUARE_TERMINAL
          - OTHER
          type: string
        refundedPaymentId:
          type: string
        refundReason:
          enum:
          - DUPLICATE
          - FRAUDULENT
          - REQUESTED_BY_CUSTOMER
          - OTHER
          type: string
      required:
      - type
      - method
    OrderRequestDocument:
      type: object
      properties:
        documentId:
          type: string
        documentModelId:
          type: string
        name:
          type: string
        createdDate:
          format: date-time
          type: string
        key:
          type: string
        isEmailSend:
          type: boolean
        isSigned:
          type: boolean
        error:
          type: boolean
      required:
      - error
    ProductField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        isTagged:
          type: boolean
      required:
      - id
      - name
      - value
      - isTagged
    ShifterInfo:
      type: object
      properties:
        shifterId:
          type: string
        status:
          type: string
          enum:
          - IMPORTED
          - TO_IMPORT
          - NONE
        importedDate:
          format: date-time
          type:
          - string
          - 'null'
      required:
      - shifterId
      - status
      - importedDate
    RawOnlineStoreProductDto:
      type: object
      properties:
        type:
          type: string
          default: product
          enum:
          - product
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        bailPrice:
          type: number
        relatedProducts:
          type: array
          items:
            type: string
        isRelatedProduct:
          type: boolean
        category:
          type: string
