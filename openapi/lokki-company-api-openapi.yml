components:
  schemas:
    UpdateCompanyTulipSettingsWordingDto:
      type: object
      properties:
        i18nContent:
          $ref: '#/components/schemas/LocalizedContent'
        i18nTitle:
          $ref: '#/components/schemas/LocalizedContent'
      required:
      - i18nContent
      - i18nTitle
    OpeningHoursRange:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
        open:
          type: string
        from:
          type: string
        to:
          type: string
      required:
      - id
      - day
      - open
      - from
      - to
    CompanyRentalPlaceDescriptionsDto:
      type: object
      properties:
        fr:
          type: string
        en:
          type: string
      required:
      - fr
      - en
    RentalPlaceStyle:
      type: object
      properties:
        backgroundColor:
          type: string
        borderRadius:
          type: string
        borderColor:
          type: string
        padding:
          type: string
    UpdateCompanyMainInfosDto:
      type: object
      properties:
        name:
          type: string
        siret:
          type: string
        legalName:
          type: string
        headquartersAddress:
          type: string
        address:
          type: string
        addressComponents:
          $ref: '#/components/schemas/UpdateCompanyAddressComponentsDto'
        longitude:
          type: number
        latitude:
          type: number
        phone:
          type: string
        addressComponentsMachine:
          $ref: '#/components/schemas/UpdateCompanyAddressComponentsDto'
    UpdateVatWorkshopDto:
      type: object
      properties:
        vatWorkshop:
          type: number
      required:
      - vatWorkshop
    FileUploadDto:
      type: object
      properties:
        file:
          type: string
          format: binary
      required:
      - file
    UpdateCompanyOnlineStorePaymentDto:
      type: object
      properties:
        onlineStorePayment:
          type: boolean
      required:
      - onlineStorePayment
    PeriodicDiscount:
      type: object
      properties:
        _id:
          type: string
        discountInPercentage:
          type: number
        startDate:
          format: date-time
          type:
          - string
          - 'null'
        endDate:
          format: date-time
          type:
          - string
          - 'null'
        applicableDate:
          enum:
          - CREATED_DATE
          - START_DATE
          type: string
        scope:
          default:
          - ONLINE_STORE
          type: array
          items:
            type: string
            enum:
            - ONLINE_STORE
            - DASHBOARD
      required:
      - _id
      - discountInPercentage
      - startDate
      - endDate
      - applicableDate
    RentalPlaceTextStyle:
      type: object
      properties:
        color:
          type: string
        fontSize:
          type: string
        fontWeight:
          type: string
        fontStyle:
          type: string
    CompanyAdyenCredentials:
      type: object
      properties:
        provider:
          type: string
          default: adyen
          enum:
          - adyen
        apiKey:
          type: string
        merchantAccount:
          type: string
        clientKey:
          type: string
        liveEndpointUrlPrefix:
          type: string
        store:
          type: string
      required:
      - provider
      - apiKey
      - merchantAccount
      - clientKey
      - liveEndpointUrlPrefix
      - store
    UpdateCompanyOnlineStoreFeaturedIdsDto:
      type: object
      properties:
        featuredIds:
          type: array
          items:
            type: string
      required:
      - featuredIds
    UpdateSquareIsActiveDto:
      type: object
      properties:
        isActive:
          type: boolean
      required:
      - isActive
    CompanyTimezone:
      type: object
      properties:
        timezone:
          type: string
      required:
      - timezone
    CompanyEventUniversesActivatedDto:
      type: object
      properties:
        isActivated:
          type: boolean
      required:
      - isActivated
    CompanyOrderReminder:
      type: object
      properties:
        emailOneDayBeforeOrderStart:
