  /v2/export-csv/orderLCD:
    get:
      operationId: exportLCDOrdersCSV
      parameters:
      - name: language
        required: true
        in: query
        schema:
          enum:
          - fr
          - en
          - de
          - it
          - pt
          - es
          - pl
          type: string
      - name: orderStatus
        required: false
        in: query
        description: Status filter applied on screen — an empty value means no filter.
        schema:
          type: array
          items:
            type: string
            enum:
            - TODAY
            - TO_COME
            - IN_PROGRESS
            - LATE
            - ENDED
            - PASS
            - PRE_BOOKING
            - PRE_BOOKING_ADMIN
            - CANCELED
            - NOT_PRE_BOOKING
            - NOT_PRE_BOOKING_ADMIN
            - NOT_CANCELED
      - name: inRange.startDate
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: inRange.endDate
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: typeNotEquals
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - ORDER
            - PRE_BOOKING
            - PRE_BOOKING_ADMIN
            - CANCELED
      responses:
