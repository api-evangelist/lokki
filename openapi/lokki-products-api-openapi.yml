openapi: 3.2.0
info:
  title: Lokki Products API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Products
paths:
  /v2/products/delete/{id}:
    delete:
      operationId: deleteProductById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Products
  /v2/products/create-product:
    post:
      operationId: createProduct
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUpdateProductDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      tags:
      - Products
  /v2/products/unarchive-subproduct/{productId}/{subProductId}:
    post:
      operationId: unarchiveSubProduct
      parameters:
      - name: productId
        required: true
        in: path
        schema:
          type: string
      - name: subProductId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
      tags:
      - Products
  /v2/products/byId/{id}:
    get:
      operationId: getProductById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      tags:
      - Products
  /v2/products/subProduct/{subProductId}:
    get:
      operationId: getSubProductById
      parameters:
      - name: subProductId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubProductIdResponse'
      tags:
      - Products
  /v2/products/subProductsByProductName/{name}/{startDate}/{endDate}:
    get:
      operationId: getSubProductsByProductName
      parameters:
      - name: name
        required: true
        in: path
        schema:
          type: string
      - name: startDate
        required: true
        in: path
        schema:
          format: date-time
          type: string
      - name: endDate
        required: true
        in: path
        schema:
          format: date-time
          type: string
      - name: currentOrderId
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetSubProductIdResponse'
      tags:
      - Products
  /v2/products/bySerialNumber/{serialNumber}/{startDate}/{endDate}:
    get:
      operationId: getSubProductsBySerialNumber
      parameters:
      - name: serialNumber
        required: true
        in: path
        schema:
          type: string
      - name: startDate
        required: true
        in: path
        schema:
          format: date-time
          type: string
      - name: endDate
        required: true
        in: path
        schema:
          format: date-time
          type: string
      - name: currentOrderId
        required: false
        in: query
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/GetSubProductIdResponse'
      tags:
      - Products
  /v2/products/subProduct/qrCode/{qrCodeValue}:
    get:
      operationId: getSubProductByExternalQrCode
      parameters:
      - name: qrCodeValue
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetSubProductIdResponse'
      tags:
      - Products
  /v2/products/getByCompany:
    get:
      operationId: getCompanyProducts
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      tags:
      - Products
  /v2/products/getByCompanyLLD:
    get:
      operationId: getCompanyLLDProducts
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      tags:
      - Products
  /v2/products/productModels:
    get:
      operationId: getCompanyProductModels
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelList'
      tags:
      - Products
  /v2/products/managingPlace/productModels:
