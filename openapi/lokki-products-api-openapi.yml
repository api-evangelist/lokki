      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetByManagingPlaceProductModelsDto'
      tags:
      - Products
  /v2/products/admin/byProductCategory/{productCategoryId}:
    get:
      operationId: getProductModelsByVerticaleCategory
      parameters:
      - name: productCategoryId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelList'
      tags:
      - Products
  /v2/products/create-product-model:
    post:
      operationId: createProductModel
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductModelDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelDto'
      tags:
      - Products
  /v2/products/delete-product-model/{productModelId}:
    delete:
      operationId: deleteProductModel
      parameters:
      - name: productModelId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
      tags:
      - Products
  /v2/products/duplicate-product-model/{productModelId}:
    post:
      operationId: duplicateProductModel
      parameters:
      - name: productModelId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Products
  /v2/products/duplicate-product/{productId}:
    post:
      operationId: duplicateProductById
      parameters:
      - name: productId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Products
  /v2/products/update-product-model:
    post:
      operationId: updateProductModel
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductModelDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModel'
      tags:
      - Products
  /v2/products/byProductModelId/{id}:
    get:
      operationId: getProductsByProductModel
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductList'
      tags:
      - Products
  /v2/products/productModelById/{id}:
    get:
      operationId: getProductModelByProductModelId
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductModelDto'
      tags:
      - Products
  /v2/products/product-models:
    get:
      operationId: listCompanyProductModels
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProductModelDto'
      tags:
      - Products
  /v2/products/getProductsInsuranceInfo:
    get:
      operationId: getProductsInsuranceInfo
      parameters:
      - name: productIds
        required: true
        in: query
        schema:
          type: array
          items:
            type: string
      - name: startDate
        required: true
        in: query
        schema:
          type: string
      - name: endDate
        required: true
        in: query
        schema:
          type: string
      - name: isLLD
        required: true
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetTulipProductInsuranceInfoResponseDto'
      tags:
      - Products
  /v2/products/enriched-infos/{productId}/{rentalType}:
    get:
      operationId: getEnrichedInfosByProductId
      parameters:
      - name: productId
        required: true
        in: path
        schema:
          type: string
      - name: rentalType
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrichedProductInfo'
      tags:
      - Products
  /v2/products/itemsQrCodePdf:
    post:
      operationId: getItemsQrCodePDF
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrCodeItemsDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodePdfDto'
      tags:
      - Products
  /v2/products/sendLokkiQrCodePdf:
    post:
      operationId: sendQrCodePdfToLokki
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendQrCodePdfToLokkiDto'
      responses:
        '201':
          description: ''
      tags:
      - Products
  /v2/products/qrcodePdf:
    post:
      operationId: getSubProductQrCodePDF
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QrCodeSubsDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QrCodePdfDto'
      tags:
      - Products
  /v2/products/subProductWithoutEvents:
    post:
      operationId: getSubProductsWithoutEventHistory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GetSubProductsWithoutEvent'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      tags:
      - Products
  /v2/products/tulip/{lokkiProductId}:
    get:
      operationId: getTulipProduct
      parameters:
      - name: lokkiProductId
        required: true
        in: path
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TulipProduct'
      tags:
      - Products
  /v2/products/tulip/register/{productId}:
    post:
      operationId: registerTulipProduct
      parameters:
      - name: productId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterTulipProductDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TulipProduct'
      tags:
      - Products
  /v2/products/tulip/softDelete/{productId}:
    post:
      operationId: softDeleteTulipProduct
      parameters:
      - name: productId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
      tags:
      - Products
  /v2/products/updateCategoryAvailability:
    put:
      operationId: updateProductCategoryAvailability
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductCategoryAvailabilityDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags:
      - Products
  /v2/products/setUnavailabilityDates/{rentalType}/{productId}/{subProductId}:
    post:
      operationId: setProductUnavailabilityDates
      parameters:
      - name: rentalType
        required: true
        in: path
        schema:
          type: string
      - name: productId
        required: true
        in: path
        schema:
          type: string
      - name: subProductId
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetProductUnavailabilityDatesBodyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetProductUnavailabilityDatesResponseDto'
      tags:
      - Products
  /v2/products/{id}:
    patch:
      operationId: patchOneProduct
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      tags:
      - Products
    put:
      operationId: putOneProduct
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutProductDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
      tags:
      - Products
  /v2/products:
    patch:
      operationId: patchManyProduct
      parameters:
      - name: ids
        required: true
        in: query
        schema:
          type: array
          items:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchProductDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Product'
      tags:
      - Products
components:
  schemas:
    EnrichedSubProductHistoryEventCustomer:
      type: object
      properties:
        companyName:
          type: string
        firstName:
          type: string
        lastName:
          type: string
      required:
      - companyName
      - firstName
      - lastName
    HistoryInspectionField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        answers:
          type: array
          items:
            $ref: '#/components/schemas/HistoryInspectionAnswer'
      required:
      - id
      - name
      - answers
    AttachedFile:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        size:
          type: number
        type:
          type: string
        uid:
          type: string
      required:
      - name
      - key
      - size
      - type
    PriceModelLLDDuration:
      type: object
      properties:
        type:
          type: string
          default: LLD
          enum:
          - LLD
        calendarMonths:
          type: number
        id:
          type: string
        price:
          type:
          - number
          - 'null'
        priceLowSeason:
          type:
          - number
          - 'null'
        label:
          $ref: '#/components/schemas/LocalizedContent'
      required:
      - type
      - calendarMonths
      - id
      - price
      - priceLowSeason
      - label
    PutProductDto:
      type: object
      properties:
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        name:
          type: string
        rentalType:
          type: string
          enum:
          - LCD
          - LLD
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProductField'
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        attachedFiles:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        rank:
          type: number
        bailPrice:
          type: number
        onlineStoreInformation:
          type: object
          properties:
            name:
              required: true
              $ref: '#/components/schemas/LocalizedContent'
            description:
              required: true
              $ref: '#/components/schemas/LocalizedContent'
        priceRule:
          allOf:
          - $ref: '#/components/schemas/ProductPriceRule'
        productModel:
          type: string
        relatedProducts:
          type: array
          items:
            type: string
        isRelatedProduct:
          type: boolean
        productSurveyId:
          type: string
        productStateId:
          type: string
        hideOnOnlineStore:
          type: boolean
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/ProductAttribute'
        vat:
          type: number
        insurance:
          $ref: '#/components/schemas/ProductInsurance'
        isSubProduct:
          type: boolean
        onlineAvailability:
          type: boolean
        displaySubProducts:
          type: boolean
        number:
          type: number
        inspectionReports:
          type: boolean
        subProducts:
          type: array
          items:
            $ref: '#/components/schemas/SubProductDto'
        verticalCategoryId:
          type: string
        translationInProgress:
          type: boolean
      required:
      - priceModels
      - name
      - rentalType
      - fields
      - imageUrl
      - videoLink
      - attachedFiles
      - rank
      - bailPrice
      - onlineStoreInformation
      - priceRule
      - productModel
      - relatedProducts
      - isRelatedProduct
      - productSurveyId
      - productStateId
      - hideOnOnlineStore
      - attributes
      - vat
      - insurance
      - isSubProduct
      - onlineAvailability
      - displaySubProducts
      - number
      - inspectionReports
      - subProducts
    EnrichedProductInfo:
      type: object
      properties:
        turnover:
          type: number
        profitability:
          type: number
        orderNumber:
          type: number
        subProducts:
          type: array
          items:
            $ref: '#/components/schemas/EnrichedSubProductInfo'
      required:
      - turnover
      - profitability
      - orderNumber
      - subProducts
    QrCodeSubInfoDto:
      type: object
      properties:
        productName:
          type: string
        serialNumber:
          type: string
        productId:
          type: string
        subProductId:
          type: string
      required:
      - productName
      - serialNumber
      - productId
      - subProductId
    PatchProductDto:
      type: object
      properties:
        rentalType:
          enum:
          - LCD
          - LLD
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/ProductField'
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        attachedFiles:
          type: array
          items:
            $ref: '#/components/schemas/AttachedFile'
        rank:
          type: number
        bailPrice:
          type: number
        onlineStoreInformation:
          $ref: '#/components/schemas/ItemOnlineStoreInformation'
        priceRule:
          allOf:
          - $ref: '#/components/schemas/ProductPriceRule'
        name:
          type: string
        productModel:
          type: string
        relatedProducts:
          type: array
          items:
            type: string
        isRelatedProduct:
          type: boolean
        productSurveyId:
          type: string
        productStateId:
          type: string
        hideOnOnlineStore:
          type: boolean
        vat:
          type: number
        subProducts:
          type: array
          items:
            $ref: '#/components/schemas/SubProduct'
        insurance:
          $ref: '#/components/schemas/ProductInsurance'
        displaySubProducts:
          type: boolean
        priceModels:
          type: array
          items:
            type: object
        inspectionReports:
          type: boolean
        isSubProduct:
          type: boolean
        number:
          type: number
        onlineAvailability:
          type: boolean
    CreateUpdateProductModelLLDPriceDto:
      type: object
      properties:
        type:
          type: string
        id:
          type: string
        label:
          $ref: '#/components/schemas/LocalizedContent'
        calendarMonths:
          type: number
      required:
      - type
      - label
      - calendarMonths
    GetSubProductsWithoutEvent:
      type: object
      properties:
        productId:
          type: string
        eventName:
          type: string
      required:
      - productId
      - eventName
    SetProductUnavailabilityDatesResponseDto:
      type: object
      properties:
        modifiedOrders:
          type: array
          items:
            $ref: '#/components/schemas/SetProductUnavailabilityDatesOrderInfoDto'
        erroredOrders:
          type: array
          items:
            $ref: '#/components/schemas/SetProductUnavailabilityDatesOrderInfoDto'
        inprogressOrders:
          type: array
          items:
            $ref: '#/components/schemas/SetProductUnavailabilityDatesOrderInfoDto'
      required:
      - modifiedOrders
      - erroredOrders
      - inprogressOrders
    CustomerSkisetInfos:
      type: object
      properties:
        customerId:
          type:
          - string
          - 'null'
      required:
      - customerId
    ProductModelList:
      type: object
      properties:
        productModels:
          type: array
          items:
            $ref: '#/components/schemas/ProductModel'
      required:
      - productModels
    ItemAttribute:
      type: object
      properties:
        attribute:
          type: string
        tags:
          type: array
          items:
            type: string
      required:
      - attribute
      - tags
    ProductField:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        value:
          type: string
        isTagged:
          type: boolean
      required:
      - id
      - name
      - value
      - isTagged
    HistoryAttachedFile:
      type: object
      properties:
        name:
          type: string
        key:
          type: string
        size:
          type: number
        type:
          type: string
        url:
          type: string
      required:
      - name
      - key
      - size
      - type
    ProductModelField:
      type: object
      properties:
        id:
          type: string
        value:
          type: string
      required:
      - id
      - value
    SubProduct:
      type: object
      properties:
        id:
          type: string
        isAvailable:
          type: boolean
        printed:
          type: boolean
        serialNumber:
          type: string
        archive:
          type: boolean
        externalQrCode:
          type: string
        notAvailableRanges:
          type: array
          items:
            $ref: '#/components/schemas/NotAvailableRange'
      required:
      - id
      - isAvailable
      - printed
      - serialNumber
      - archive
      - externalQrCode
      - notAvailableRanges
    QrCodeItemsServiceInfoDto:
      type: object
      properties:
        type:
          type: string
          default: service
