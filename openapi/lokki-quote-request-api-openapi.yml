          - renter
          type: string
          description: Type of quote request (agency or private)
          example: agency
        companyId:
          type: string
          description: Company ID which received the quote request (ObjectId)
          example: 64b7f8f2e4b0c2a1d5e6f788
        rentalPointId:
          type: string
          description: Rental point ID where the quote request has been made (ObjectId)
          example: 64b7f8f2e4b0c2a1d5e6f787
        status:
          enum:
          - REQUEST
          - CANCELED
          - SENDED
          - CONVERTED
          - EXPIRED
          type: string
          description: Quote request status
          example: REQUEST
        orderId:
          type: string
          description: Linked order ID of the order created from the quote (ObjectId)
          example: 64b7f8f2e4b0c2a1d5e6f786
        customer:
          description: Customer information, filled by the user who made the quote request
          allOf:
          - $ref: '#/components/schemas/QuoteRequestCustomer'
        projectInfos:
          description: Project information, filled by the user who made the quote request
          allOf:
          - $ref: '#/components/schemas/QuoteRequestProjectInfos'
        cancelReason:
          enum:
          - NO_SUPPLY
          - UNAVAILABLE_ACCESSORY
          - SCHEDULING_ISSUE
          - NON_COMPATIBLE_REQUEST
          - UNSPECIFIC_REQUEST
          - CUSTOMER_SUITABILITY
          - INVENTORY_UNAVAILABILITY
          - WEATHER
          - EXCEPTIONAL_CLOSURE
          - LAST_MINUTE_REQUEST
          - OTHER
          - USER_SELF_CHECKOUT
          type: string
          description: Reason for quote request cancellation
          example: INVENTORY_UNAVAILABILITY
        customCancelReason:
          type: string
          description: Reason for quote request cancellation that is not in the predefined list
          example: Found a better deal elsewhere
        metadata:
          description: Additional metadata about the quote request
          allOf:
          - $ref: '#/components/schemas/QuoteRequestMetadata'
        sendedDate:
          format: date-time
          type: string
          description: Date when the renter sent an answer to the quote request
          example: '2025-10-16T10:30:00.000Z'
        cancelDate:
          format: date-time
          type: string
          description: Date when the quote request has been canceled
          example: '2025-10-16T10:30:00.000Z'
        convertedDate:
          format: date-time
          type: string
          description: Date when the quote request has been converted into an order
          example: '2025-10-16T10:30:00.000Z'
        createdDate:
          format: date-time
          type: string
          description: Date when the quote request has been created
          example: '2025-10-16T10:30:00.000Z'
      required:
      - id
      - type
      - companyId
      - rentalPointId
      - status
      - customer
      - projectInfos
    GetManyQuoteRequestsResponseDto:
      type: object
      properties:
        total:
          type: number
          description: Total number of documents matching the query
          minimum: 0
          example: 150
        docs:
          type: array
          items:
            $ref: '#/components/schemas/QuoteRequestEntity'
      required:
      - total
      - docs
    StorePricing:
      type: object
      properties:
        currency:
          description: Store currency information
          allOf:
          - $ref: '#/components/schemas/StoreCurrency'
        tax:
          description: Store tax information
          allOf:
          - $ref: '#/components/schemas/StoreTax'
        discount:
          description: Store discount information
          allOf:
          - $ref: '#/components/schemas/StoreDiscount'
        showPricingTable:
          type: boolean
          description: Whether the store chooses to display the full pricing table (price per duration).
          example: true
      required:
      - currency
      - tax
      - discount
      - showPricingTable
    StoreDelivery:
      type: object
      properties:
        enabled:
          type: boolean
          description: Indicates if delivery is enabled for this store
          example: true
        deliveryOnly:
          type: boolean
          description: Indicates if only delivery is allowed for this store
          example: false
        ranges:
          description: List of delivery ranges for this store
          type: array
          items:
            $ref: '#/components/schemas/StoreDeliveryRange'
        excludedCities:
          description: List of cities excluded from delivery
          type: array
          items:
            $ref: '#/components/schemas/StoreDeliveryRangeSpecificPriceCity'
        freeDelivery:
          description: Free delivery settings for this store
          allOf:
          - $ref: '#/components/schemas/StoreDeliveryFreeSettings'
        returnDelivery:
          type: boolean
          description: Indicates if return delivery is enabled for this store
          example: false
      required:
      - enabled
      - deliveryOnly
      - ranges
      - excludedCities
      - freeDelivery
      - returnDelivery
    StoreGeo:
      type: object
      properties:
        location:
          description: Queried location for the store (or main location if none queried). May be null if address display is disabled
          allOf:
          - $ref: '#/components/schemas/StoreLocation'
        locations:
          description: List of rental point locations. May be null if none exist or address display is disabled
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/StoreLocation'
      required:
      - location
      - locations
    CancelQuoteRequestDto:
      type: object
      properties:
        cancelReason:
          enum:
          - NO_SUPPLY
          - UNAVAILABLE_ACCESSORY
          - SCHEDULING_ISSUE
          - NON_COMPATIBLE_REQUEST
          - UNSPECIFIC_REQUEST
          - CUSTOMER_SUITABILITY
          - INVENTORY_UNAVAILABILITY
          - WEATHER
          - EXCEPTIONAL_CLOSURE
          - LAST_MINUTE_REQUEST
          - OTHER
          - USER_SELF_CHECKOUT
          type: string
          description: Reason for canceling the quote request
          example: NO_SUPPLY
        customCancelReason:
          type: string
          description: Custom cancellation reason when cancelReason is OTHER
          example: Equipment not suitable for the requested dates
      required:
      - cancelReason
    AddressComponents:
      type: object
      properties:
        streetNumber:
          type: string
          description: Street number
          example: '4'
        street:
          type: string
          description: Street name
          example: Rue du Commandant Rivière
        postalCode:
          type: string
          description: Postal code
          example: '75008'
        city:
          type: string
          description: City name
          example: Paris
        administrativeAreaLevel1:
          type: string
          description: Administrative area level 1 (e.g. state or province)
          example: Île-de-France
        administrativeAreaLevel2:
          type: string
          description: Administrative area level 2 (e.g. city or district)
          example: Paris
        country:
          type: string
          description: Country name
          example: France
      required:
      - streetNumber
      - street
      - postalCode
      - city
      - administrativeAreaLevel1
      - administrativeAreaLevel2
      - country
    StoreCancellationRange:
      type: object
      properties:
        hourThreshold:
          type: number
          description: Threshold in hours before the booking start time for this cancellation range. (e.g. 48 means cancellations made more than 48 hours before start)
          example: 48
        refundType:
          enum:
          - PERCENTAGE
          - AMOUNT
          type: string
          description: Type of refund for this cancellation range
          example: PERCENTAGE
        refundAmount:
          type: number
          description: Refund amount for this cancellation range
          example: 50
      required:
      - hourThreshold
      - refundType
      - refundAmount
    StoreBookingTimeAnchorTime:
      type: object
      properties:
        hours:
          type: number
          description: Hours of the time anchor
          example: 9
        minutes:
          type: number
          description: Minutes of the time anchor
          example: 30
      required:
      - hours
      - minutes
    QuoteRequestProjectInfos:
      type: object
      properties:
        startDate:
          format: date-time
          type: string
          description: Quote request start date the customer wants
          example: '2025-10-16T10:30:00.000Z'
        endDate:
          format: date-time
          type: string
          description: Quote request end date the customer wants
          example: '2025-10-20T10:30:00.000Z'
        verticales:
          type: array
          items:
            type: string
            enum:
            - BIKE
            - ELECTRIC_BIKE
            - MOPED
            - MOTORCYCLE
            - CAR
            - SCOOTER
            - SKI
            - CLIMBING
            - SNOWSHOES
            - SURF
            - PADDLE
            - CANOE_KAYAK
            - BOAT
            - EVENT
            - MOTOCULTURE
            - TOOLING
          description: Product verticales concerned by the quote request
          example:
          - BIKE
          - MOPED
        description:
          type: string
          description: Detailed description of the customer's project
          example: I need a bike for a week...
        participants:
          description: List of participants informations that will help the renter to provide a relevant quote
          type: array
          items:
            $ref: '#/components/schemas/QuoteRequestParticipant'
        budget:
          type:
          - number
          - 'null'
          description: Estimated maximum budget of the customer for this quote request, may help the renter to provide a relevant quote
          example: 100
        flexibility:
          enum:
          - exact_dates
          - more_less_1_day
          - more_less_2_days
          - more_less_3_days
          - more_less_7_days
          type: string
          description: Flexibility of the customer's dates, may help the renter to provide a relevant quote if stock is limited
          example: more_less_1_day
        rentDuration:
          enum:
          - 2_hours
          - half_day
          - 1_day
          type: string
          description: If the rental is for one day, precise the duration of the rent
          example: 2_hours
        pickUpTime:
          enum:
          - morning
          - afternoon
          - whenever
          type: string
          description: The pick-up time the customer would prefer for the rental
          example: morning
        location:
          type: string
          description: Full address of the event or project location
          example: 12 Rue de Rivoli, 75001 Paris, France
        lat:
          type: number
          description: Latitude of the project location
          example: 48.8566
        lng:
          type: number
          description: Longitude of the project location
          example: 2.3522
        projectDetails:
          description: Additional project details specific to agency quote requests
          type: array
          items:
            type: string
      required:
      - startDate
      - endDate
      - verticales
      - participants
    StoreDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the booking store - MongoDB ObjectId
          example: 64b64c4f5f3c2a6d8e7f9b0a
        slug:
          type: string
          description: Unique identifier for the store. Used for URL paths (e.g., https://www.lokki.rent/loueur/my-store)
          example: my-store
        rentalPointSlug:
          type: string
          description: Slug of the rental point to get details for. If not provided, main store location is used.
          example: my-rental-point
        profile:
          description: Store general profile information (name, description, verticales)
          allOf:
          - $ref: '#/components/schemas/StoreProfile'
        localization:
          description: Store localization information (current, default, available languages)
          allOf:
          - $ref: '#/components/schemas/StoreLocalization'
        contact:
          description: Store contact information (email, phone, website, social media, etc.)
          allOf:
          - $ref: '#/components/schemas/StoreContact'
        branding:
          description: Store branding information (banners, colors, etc.)
          allOf:
          - $ref: '#/components/schemas/StoreBranding'
        geo:
          description: Store geographical information (main and secondary locations)
          allOf:
          - $ref: '#/components/schemas/StoreGeo'
        modules:
          description: Store modules settings (delivery, online payment, insurance, etc.)
          allOf:
          - $ref: '#/components/schemas/StoreModules'
        reviews:
          description: Store reviews from external platforms (e.g., Google Reviews)
          allOf:
          - $ref: '#/components/schemas/StoreReviews'
        temporal:
          description: Store temporal settings (opening hours, timezone, etc.)
          allOf:
          - $ref: '#/components/schemas/StoreTemporal'
        pricing:
          description: Store pricing settings (currency, tax, discounts, etc.)
          allOf:
          - $ref: '#/components/schemas/StorePricing'
        booking:
          description: Booking settings
          allOf:
          - $ref: '#/components/schemas/StoreBookingSettings'
        checkout:
          description: Checkout settings (payment methods, deposit, part payment)
          allOf:
          - $ref: '#/components/schemas/StoreCheckout'
        metadata:
          description: Store technical metadata and timestamps
          allOf:
          - $ref: '#/components/schemas/StoreMetadata'
        marketing:
          description: Store marketing tracker IDs configured by the store owner
          allOf:
          - $ref: '#/components/schemas/StoreMarketing'
      required:
      - id
      - slug
      - profile
      - localization
      - contact
      - branding
      - geo
      - modules
      - reviews
      - temporal
      - pricing
      - booking
      - checkout
      - metadata
    StoreGoogleReviewAuthor:
      type: object
      properties:
        name:
          type: string
          description: Author name of the Google Review
          example: John Doe
        profilePictureUrl:
          type: string
          description: Profile picture URL of the Google Review author
          example: https://example.com/profile.jpg
      required:
      - name
      - profilePictureUrl
    StoreLocation:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the secondary location
          example: 64b64c4f5f3c2a6d8e7f9b0b
        name:
          type: string
          description: Name of the secondary location
          example: Point de retrait - Gare de Lyon
        slug:
          type: string
          description: Unique slug for the secondary location, used in URLs (https://www.lokki.rent/loueur/my-store/magasin/my-location)
          example: my-location
        address:
          type: string
          description: Full address as a single string
          example: 4 Rue du Commandant Rivière, 75008 Paris, France
        placeId:
          type: string
          description: Google Place ID for the location
          example: ChIJLU7jZClu5kcR4PcOOO6p3I0
        components:
          description: Detailed address components
          allOf:
          - $ref: '#/components/schemas/AddressComponents'
        canonicalComponents:
          description: Detailed address components, normalized in english
          allOf:
          - $ref: '#/components/schemas/AddressComponents'
        point:
          description: Geographical point (latitude and longitude)
          allOf:
          - $ref: '#/components/schemas/StoreLocationPoint'
      required:
      - id
      - name
      - slug
      - address
      - placeId
      - components
      - canonicalComponents
      - point
    StoreAncvProviderConfig:
      type: object
      properties: {}
    StoreBookingSettings:
