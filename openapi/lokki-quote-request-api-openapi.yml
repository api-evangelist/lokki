          - $ref: '#/components/schemas/StoreInstantBooking'
        fixedDurations:
          description: Predefined booking durations
          allOf:
          - $ref: '#/components/schemas/StoreBookingFixedDurations'
        rules:
          description: Booking rules and restrictions
          allOf:
          - $ref: '#/components/schemas/StoreBookingRules'
      required:
      - bookingType
      - instantBooking
      - fixedDurations
      - rules
    StoreContactSocialMedia:
      type: object
      properties:
        facebook:
          type:
          - string
          - 'null'
          description: Facebook profile URL
          example: https://www.facebook.com/henricorp
        twitter:
          type:
          - string
          - 'null'
          description: Twitter profile URL
          example: https://www.twitter.com/henricorp
        instagram:
          type:
          - string
          - 'null'
          description: Instagram profile URL
          example: https://www.instagram.com/henricorp
        linkedIn:
          type:
          - string
          - 'null'
          description: LinkedIn profile URL
          example: https://www.linkedin.com/company/henricorp
        tiktok:
          type:
          - string
          - 'null'
          description: TikTok profile URL
          example: https://www.tiktok.com/@henricorp
      required:
      - facebook
      - twitter
      - instagram
      - linkedIn
      - tiktok
    PaymentInfo:
      type: object
      properties:
        paymentLink:
          type: string
          description: Payment link URL (your-order)
          example: https://rent-item.lokki.rent/your-order/{orderId}
  securitySchemes:
    x-access-token:
      scheme: bearer
      bearerFormat: JWT
      type: apiKey
      in: header
      name: x-access-token
