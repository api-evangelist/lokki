openapi: 3.2.0
info:
  title: Lokki Webhook API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Webhook
paths:
  /v2/webhook/hyperline:
    post:
      operationId: handleHyperlineWebhook
      parameters:
      - name: webhook-id
        required: true
        in: header
        schema:
          type: string
      - name: webhook-timestamp
        required: true
        in: header
        schema:
          type: string
      - name: webhook-signature
        required: true
        in: header
        schema:
          type: string
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                type: object
      tags:
      - Webhook
components:
  securitySchemes:
    x-access-token:
      scheme: bearer
      bearerFormat: JWT
      type: apiKey
      in: header
      name: x-access-token
