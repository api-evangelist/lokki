          - RENTAL_PLACE
          - ONLINE_STORE
          description: 'Storefront the cart belongs to. A cart is scoped to a (companyId, context) pair: the same loueur has an independent cart on the open marketplace (RENTAL_PLACE) and on its white-label BEL 2.0 store (ONLINE_STORE). Absent on legacy carts — readers treat that as RENTAL_PLACE.'
        rentalPeriod:
          $ref: '#/components/schemas/CartRentalPeriod'
        type:
          type: string
          enum:
          - LLD
          - LCD
          - EVENT
        payments:
          type: array
          items:
            $ref: '#/components/schemas/CartPayment'
        delivery:
          $ref: '#/components/schemas/CartDelivery'
        marketing:
          $ref: '#/components/schemas/CartMarketing'
        legal:
          $ref: '#/components/schemas/CartLegal'
        metadata:
          $ref: '#/components/schemas/CartMetadata'
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/RPCartItemProduct'
            - $ref: '#/components/schemas/RPCartItemService'
            - $ref: '#/components/schemas/RPCartItemPack'
        companyInfo:
          $ref: '#/components/schemas/CartCompanyInfo'
        price:
          $ref: '#/components/schemas/CartPrice'
        checkout:
          $ref: '#/components/schemas/CartCheckout'
      required:
      - id
      - companyId
      - rentalPeriod
      - type
      - createdAt
      - updatedAt
      - items
      - companyInfo
      - price
    RPCartItemPack:
      type: object
      properties:
        id:
          type: string
        quantity:
          type: number
        stock:
          $ref: '#/components/schemas/ItemStock'
        infos:
          $ref: '#/components/schemas/ItemInfos'
        media:
          $ref: '#/components/schemas/ItemMedia'
        pricing:
          $ref: '#/components/schemas/ItemPricing'
        category:
          $ref: '#/components/schemas/ItemCategory'
        settings:
          description: Settings and configuration for the item
          allOf:
          - $ref: '#/components/schemas/ItemSettings'
        type:
          type: string
          enum:
          - PACK
        options:
          type: array
          items:
            $ref: '#/components/schemas/RPCartItemPackOption'
        packType:
          type: string
          enum:
          - PRODUCT
          - CATEGORY
        categories:
          type: array
          items:
            $ref: '#/components/schemas/RPCartItemPackCategoryWithStock'
      required:
      - id
      - quantity
      - stock
      - infos
      - media
      - pricing
      - category
      - settings
      - type
      - options
      - packType
      - categories
    PriceRule:
      type: object
      properties:
        _id:
          type: string
        startDate:
          $ref: '#/components/schemas/PriceRuleDate'
        endDate:
          $ref: '#/components/schemas/PriceRuleDate'
        type:
          type: string
          enum:
          - in
          - include
          - overlap
        variation:
          type: number
      required:
      - startDate
      - endDate
      - type
      - variation
    ItemPricing:
      type: object
      properties:
        basis:
          enum:
          - RANGE_COMPUTED
          - LOWEST_PRICE
          type: string
          description: Basis used for pricing the item
          example: LOWEST_PRICE
        price:
          type:
          - number
          - 'null'
          description: Rental price of the item (null if no price available)
          example: 29.99
        basePrice:
          type:
          - number
          - 'null'
          description: Base rental price of the item (without discounts, null if no price available)
          example: 29.99
        discount:
          description: Discount applied to the item
          allOf:
          - $ref: '#/components/schemas/ItemPricingDiscount'
        deposit:
          description: Deposit amount for the item
          allOf:
          - $ref: '#/components/schemas/ItemDeposit'
        vat:
          description: VAT information for the item (null means store default VAT)
          allOf:
          - $ref: '#/components/schemas/ItemVat'
        pricingTable:
          description: Full pricing table split by season. Null when the store has disabled the pricing table display.
          allOf:
          - $ref: '#/components/schemas/ItemPricingTable'
        priceRule:
          description: Full price rule associated with this item (id + title + rules). Null when no price rule is configured.
          allOf:
          - $ref: '#/components/schemas/ItemPriceRule'
      required:
      - basis
      - price
      - basePrice
      - discount
      - deposit
      - vat
      - pricingTable
      - priceRule
    CartCompanyTemporal:
      type: object
      properties:
        timezone:
          type: string
      required:
      - timezone
    ItemPricingTableEntryDurationLld:
      type: object
      properties:
        type:
          type: string
          enum:
          - LLD
        months:
          type: number
          description: Duration in calendar months
          example: 12
      required:
      - type
      - months
    PriceRuleDate:
      type: object
      properties:
        day:
          type: number
        time:
          type: string
      required:
      - day
      - time
    CartMetadata:
      type: object
      properties:
        note:
          type: string
        customerFields:
          type: array
          items:
            $ref: '#/components/schemas/CartCustomerField'
        attribution:
          $ref: '#/components/schemas/CartAttribution'
    CartCompanyAddressComponents:
      type: object
      properties:
        streetNumber:
          type: string
        street:
          type: string
        postalCode:
          type: string
        city:
          type: string
        administrativeAreaLevel1:
          type: string
        administrativeAreaLevel2:
          type: string
        country:
          type: string
      required:
      - streetNumber
      - street
      - postalCode
      - city
      - administrativeAreaLevel1
      - administrativeAreaLevel2
      - country
  securitySchemes:
    x-access-token:
      scheme: bearer
      bearerFormat: JWT
      type: apiKey
      in: header
      name: x-access-token
