openapi: 3.2.0
info:
  title: Lokki Rental Place API
  description: The main API powering the Lokki Dashboard and Online Store
  version: '2.0'
  contact: {}
servers: []
security:
- x-access-token: []
tags:
- name: Rental Place
paths:
  /v2/rental-place/googleRating/lokki:
    get:
      operationId: getGoogleRatingLokki
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GoogleRating'
      tags:
      - Rental Place
  /v2/rental-place/universes:
    get:
      operationId: getRentalPlaceUniverses
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPlaceUniversesDto'
      tags:
      - Rental Place
  /v2/rental-place/stores:
    get:
      operationId: getRentalPlaceStores
      parameters:
      - name: lat
        required: true
        in: query
        schema:
          type: number
      - name: lng
        required: true
        in: query
        schema:
          type: number
      - name: universes
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
      - name: verticales
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - BIKE
            - ELECTRIC_BIKE
            - MOPED
            - MOTORCYCLE
            - CAR
            - SCOOTER
            - SKI
            - CLIMBING
            - SNOWSHOES
            - SURF
            - PADDLE
            - CANOE_KAYAK
            - BOAT
            - EVENT
            - MOTOCULTURE
            - TOOLING
      - name: categories
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
      - name: radius
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: limit
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: checkAvailability
        required: false
        in: query
        schema:
          type: boolean
      - name: delivery
        required: false
        in: query
        schema:
          type: boolean
      - name: insurance
        required: false
        in: query
        schema:
          type: boolean
      - name: onlinePayment
        required: false
        in: query
        schema:
          type: boolean
      - name: priceRangeMin
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: priceRangeMax
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: view
        required: false
        in: query
        schema:
          enum:
          - default
          - fast
          - events
          - roaming
          - toprating
          - manyratings
          - cancellation
          - groups
          - promo
          - shortrent
          - longrent
          type: string
      - name: startDateAvailability
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: endDateAvailability
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: onlineBooking
        required: false
        in: query
        schema:
          type: boolean
      - name: filterOutEmptyStocks
        required: false
        in: query
        schema:
          type: boolean
      - name: sortByRating
        required: false
        in: query
        schema:
          type: boolean
      - name: getBestSellers
        required: false
        in: query
        schema:
          type: boolean
      - name: isLLD
        required: false
        in: query
        schema:
          type: boolean
      - name: getEvent
        required: false
        in: query
        schema:
          type: boolean
      - name: language
        required: true
        in: query
        schema:
          enum:
          - fr
          - en
          - nl
          - de
          - it
          - pt
          - es
          - pl
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPlaceCompaniesDto'
      tags:
      - Rental Place
  /v2/rental-place/partner/stores/zone:
    get:
      operationId: getPartnerZoneRentalPlaceStores
      parameters:
      - name: swLat
        required: true
        in: query
        schema:
          type: number
      - name: swLng
        required: true
        in: query
        schema:
          type: number
      - name: neLat
        required: true
        in: query
        schema:
          type: number
      - name: neLng
        required: true
        in: query
        schema:
          type: number
      - name: verticales
        required: true
        in: query
        schema:
          default:
          - BIKE
          - ELECTRIC_BIKE
          type: array
          items:
            type: string
            enum:
            - BIKE
            - ELECTRIC_BIKE
            - MOPED
            - MOTORCYCLE
            - CAR
            - SCOOTER
            - SKI
            - CLIMBING
            - SNOWSHOES
            - SURF
            - PADDLE
            - CANOE_KAYAK
            - BOAT
            - EVENT
            - MOTOCULTURE
            - TOOLING
      - name: persons
        required: true
        in: query
        schema:
          minimum: 1
          type: number
      - name: minPrice
        required: true
        in: query
        schema:
          minimum: 0
          type: number
      - name: maxPrice
        required: true
        in: query
        schema:
          minimum: 0
          type: number
      - name: startDate
        required: true
        in: query
        schema:
          format: date-time
          type: string
      - name: endDate
        required: true
        in: query
        schema:
          format: date-time
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PartnerRentalPlaceCompaniesDto'
      tags:
      - Rental Place
  /v2/rental-place/store/{slug}:
    get:
      operationId: getRentalPlaceStore
      parameters:
      - name: slug
        required: true
        in: path
        schema:
          type: string
      - name: language
        required: true
        in: query
        schema:
          enum:
          - fr
          - en
          - nl
          - de
          - it
          - pt
          - es
          - pl
          type: string
      - name: withNotOnboarded
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPlaceExtraCompanyInfoDto'
      tags:
      - Rental Place
  /v2/rental-place/store/byId/{id}:
    get:
      operationId: getRentalPlaceStoreById
      parameters:
      - name: id
        required: true
        in: path
        schema:
          type: string
      - name: language
        required: true
        in: query
        schema:
          enum:
          - fr
          - en
          - nl
          - de
          - it
          - pt
          - es
          - pl
          type: string
      - name: withNotOnboarded
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPlaceExtraCompanyInfoDto'
      tags:
      - Rental Place
  /v2/rental-place/stores/allSlugs:
    get:
      operationId: getAllRentalPlaceStoresSlugs
      parameters:
      - name: withNotOnboarded
        required: false
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
      tags:
      - Rental Place
  /v2/rental-place/universe:
    post:
      operationId: createRentalPlaceUniverse
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCreateRentalPlaceUniverseDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RentalPlaceUniverseDto'
      tags:
      - Rental Place
  /v2/rental-place/company/{companyId}/visit:
    post:
      operationId: countNewVisitToRentalPlaceCompany
      parameters:
      - name: companyId
        required: true
        in: path
        schema:
          type: string
      responses:
        '201':
          description: ''
      tags:
      - Rental Place
  /v2/rental-place/search:
    get:
      operationId: rentalPlaceSearch
      parameters:
      - name: lat
        required: true
        in: query
        schema:
          minimum: -90
          maximum: 90
          type: number
      - name: lng
        required: true
        in: query
        schema:
          minimum: -180
          maximum: 180
          type: number
      - name: verticales
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
            enum:
            - BIKE
            - ELECTRIC_BIKE
            - MOPED
            - MOTORCYCLE
            - CAR
            - SCOOTER
            - SKI
            - CLIMBING
            - SNOWSHOES
            - SURF
            - PADDLE
            - CANOE_KAYAK
            - BOAT
            - EVENT
            - MOTOCULTURE
            - TOOLING
      - name: categories
        required: false
        in: query
        schema:
          type: array
          items:
            type: string
      - name: radius
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: lokkiOnly
        required: false
        in: query
        schema:
          type: boolean
      - name: inDeliveryRange
        required: false
        in: query
        schema:
          type: boolean
      - name: delivery
        required: false
        in: query
        schema:
          type: boolean
      - name: insurance
        required: false
        in: query
        schema:
          type: boolean
      - name: onlinePayment
        required: false
        in: query
        schema:
          type: boolean
      - name: lld
        required: false
        in: query
        schema:
          type: boolean
      - name: dailyPriceMin
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: dailyPriceMax
        required: false
        in: query
        schema:
          type: number
      - name: view
        required: false
        in: query
        schema:
          enum:
          - default
          - fast
          - events
          - roaming
          - toprating
          - manyratings
          - cancellation
          - groups
          - promo
          - shortrent
          - longrent
          type: string
      - name: startDateAvailability
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: endDateAvailability
        required: false
        in: query
        schema:
          format: date-time
          type: string
      - name: limit
        required: false
        in: query
        schema:
          minimum: 0
          type: number
      - name: sortBy
        required: false
        in: query
        schema:
          enum:
          - distance
          - bestRated
          - nbRentals
          - nbReviews
          - relevance
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RentalPlaceStoresWithProductsDto'
      tags:
      - Rental Place
components:
  schemas:
    RawOnlineStoreVerticalCategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        i18nKey:
          type: string
      required:
      - id
      - name
      - i18nKey
    OpeningTimeFrame:
      type: object
      properties:
        id:
          type: string
        day:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          - ALL
        isOpen:
          type: boolean
        from:
          type: string
        to:
          type: string
      required:
      - id
      - day
      - isOpen
    PriceModelLLDDuration:
      type: object
      properties:
        type:
          type: string
          default: LLD
          enum:
          - LLD
        calendarMonths:
          type: number
        id:
          type: string
        price:
          type:
          - number
          - 'null'
        priceLowSeason:
          type:
          - number
          - 'null'
        label:
          $ref: '#/components/schemas/LocalizedContent'
      required:
      - type
      - calendarMonths
      - id
      - price
      - priceLowSeason
      - label
    RentalPlacePriceDto:
      type: object
      properties:
        initial:
          type:
          - number
          - 'null'
        discounted:
          type:
          - number
          - 'null'
      required:
      - initial
      - discounted
    RawOnlineStoreSubProductDto:
      type: object
      properties:
        id:
          type: string
        isAvailable:
          type: boolean
      required:
      - id
      - isAvailable
    CompanyRentalPlaceDescriptionsDto:
      type: object
      properties:
        fr:
          type: string
        en:
          type: string
      required:
      - fr
      - en
    DeliveryRangeSpecificPrice:
      type: object
      properties:
        price:
          type: number
        cities:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDeliveryCity'
      required:
      - price
      - cities
    DeliveryRange:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
        price:
          type: number
        specificPrices:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryRangeSpecificPrice'
      required:
      - min
      - max
      - price
      - specificPrices
    CompanyRentalPlaceTeamDto:
      type: object
      properties:
        descriptions:
          $ref: '#/components/schemas/CompanyRentalPlaceDescriptionsDto'
        image:
          type: string
        video:
          type: string
        teamName:
          type: string
      required:
      - descriptions
      - image
      - video
      - teamName
    RawOnlineStorePackDto:
      type: object
      properties:
        type:
          type: string
          default: pack
          enum:
          - pack
        category:
          type: string
          default: pack
          enum:
          - pack
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        bailAmount:
          type: number
        relatedProducts:
          type: array
          items:
            type: string
        isRelatedProduct:
          type: boolean
        options:
          type: array
          items:
            $ref: '#/components/schemas/RawOnlineStorePackOptionDto'
        packType:
          enum:
          - PRODUCT
          - CATEGORY
          type: string
        categories:
          type: array
          items:
            $ref: '#/components/schemas/PackCategory'
        id:
          type: string
        name:
          type: string
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedContent'
        rank:
          type: number
        productSurveyId:
          type: string
        vat:
          type: number
        onlineAvailability:
          type: boolean
        isAvailable:
          type: boolean
        hideOnOnlineStore:
          type: boolean
      required:
      - type
      - category
      - priceModels
      - bailAmount
      - relatedProducts
      - isRelatedProduct
      - options
      - packType
      - categories
      - id
      - name
      - onlineStoreName
      - imageUrl
      - videoLink
      - description
      - rank
      - productSurveyId
      - vat
      - onlineAvailability
      - isAvailable
      - hideOnOnlineStore
    RawOnlineStoreProductDto:
      type: object
      properties:
        type:
          type: string
          default: product
          enum:
          - product
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        bailPrice:
          type: number
        relatedProducts:
          type: array
          items:
            type: string
        isRelatedProduct:
          type: boolean
        category:
          type: string
        productModel:
          type: string
        verticalCategory:
          $ref: '#/components/schemas/RawOnlineStoreVerticalCategoryDto'
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OnlineStoreProductTags'
        insurance:
          $ref: '#/components/schemas/ProductInsurance'
        subProducts:
          type: array
          items:
            $ref: '#/components/schemas/RawOnlineStoreSubProductDto'
        id:
          type: string
        name:
          type: string
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedContent'
        rank:
          type: number
        productSurveyId:
          type: string
        vat:
          type: number
        onlineAvailability:
          type: boolean
        isAvailable:
          type: boolean
        hideOnOnlineStore:
          type: boolean
      required:
      - type
      - priceModels
      - bailPrice
      - relatedProducts
      - isRelatedProduct
      - category
      - productModel
      - verticalCategory
      - tags
      - insurance
      - subProducts
      - id
      - name
      - onlineStoreName
      - imageUrl
      - videoLink
      - description
      - rank
      - productSurveyId
      - vat
      - onlineAvailability
      - isAvailable
      - hideOnOnlineStore
    CompanyAddressComponentsDto:
      type: object
      properties:
        streetNumber:
          type: string
        street:
          type: string
        postalCode:
          type: string
        city:
          type: string
        administrativeAreaLevel1:
          type: string
        administrativeAreaLevel2:
          type: string
        country:
          type: string
        placeId:
          type: string
      required:
      - streetNumber
      - street
      - postalCode
      - city
      - administrativeAreaLevel1
      - administrativeAreaLevel2
      - country
      - placeId
    PriceModelRangeDuration:
      type: object
      properties:
        type:
          type: string
          default: range
          enum:
          - range
        minDuration:
          type: number
        maxDuration:
          type: number
        durationInDays:
          type: number
        id:
          type: string
        price:
          type:
          - number
          - 'null'
        priceLowSeason:
          type:
          - number
          - 'null'
        label:
          $ref: '#/components/schemas/LocalizedContent'
      required:
      - type
      - minDuration
      - maxDuration
      - id
      - price
      - priceLowSeason
      - label
    PackCategory:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        productModelId:
          type: string
        fieldId:
          type: string
      required:
      - id
      - name
      - productModelId
      - fieldId
    ProductDetails:
      type: object
      properties:
        name:
          type: string
        image:
          type:
          - string
          - 'null'
      required:
      - name
      - image
    CompanyDelivery:
      type: object
      properties:
        activated:
          type: boolean
        ranges:
          type: array
          items:
            $ref: '#/components/schemas/DeliveryRange'
        deliveryOnly:
          type: boolean
        returnDelivery:
          type: boolean
        freeDeliveryActivated:
          type: boolean
        freeDeliveryMinimumType:
          type: string
          enum:
          - MINUTES
          - SUBTOTAL
        freeDeliveryMinimumVal:
          type: number
        excludedCities:
          type: array
          items:
            $ref: '#/components/schemas/CompanyDeliveryCity'
      required:
      - activated
      - ranges
      - deliveryOnly
      - returnDelivery
      - freeDeliveryActivated
      - freeDeliveryMinimumType
      - freeDeliveryMinimumVal
      - excludedCities
    CompanyRentalPlaceUniversesDto:
      type: object
      properties:
        id:
          type: string
        categoryIds:
          type: array
          items:
            type: string
        pack:
          type: boolean
      required:
      - id
      - categoryIds
      - pack
    RentalPlaceCompanyPriceRangeDto:
      type: object
      properties:
        min:
          type: number
        max:
          type: number
      required:
      - min
      - max
    RentalPlaceDiscoverEventDto:
      type: object
      properties:
        id:
          type: string
        urlImage:
          type: string
        name:
          $ref: '#/components/schemas/LocalizedContent'
        duration:
          type: number
        slot:
          type: number
        price:
          type: number
      required:
      - id
      - urlImage
      - name
      - duration
      - slot
      - price
    EventUniverse:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        imageUrl:
          type: string
      required:
      - id
      - name
      - imageUrl
    PartnerRentalPlaceCompanyDto:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        logoURL:
          type: string
        images:
          type: array
          items:
            type: string
        lat:
          type: number
        lng:
          type: number
        url:
          type: string
        availableProducts:
          type: array
          items:
            type: string
        availableProductsDetails:
          type: array
          items:
            $ref: '#/components/schemas/ProductDetails'
        totalNbAvailableProducts:
          type: number
        averagePrice:
          type: number
        minPrice:
          type: number
        maxPrice:
          type: number
        googleRating:
          type: number
        googleReviewsNb:
          type: number
        description:
          type: string
        descriptionHtml:
          type: string
        delivery:
          type: boolean
        deliveryRange:
          type: number
        insurance:
          type: boolean
        address:
          type: string
      required:
      - name
      - slug
      - logoURL
      - images
      - lat
      - lng
      - url
      - availableProducts
      - availableProductsDetails
      - totalNbAvailableProducts
      - averagePrice
      - minPrice
      - maxPrice
      - googleRating
      - googleReviewsNb
      - description
      - descriptionHtml
      - delivery
      - deliveryRange
      - insurance
      - address
    RawOnlineStoreServiceDto:
      type: object
      properties:
        type:
          type: string
          default: service
          enum:
          - service
        priceModels:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/PriceModelSpecificDuration'
            - $ref: '#/components/schemas/PriceModelRangeDuration'
            - $ref: '#/components/schemas/PriceModelLLDDuration'
        category:
          type: string
        tags:
          type: array
          items:
            $ref: '#/components/schemas/OnlineStoreProductTags'
        isRelatedProducts:
          type: boolean
        relatedProducts:
          type: array
          items:
            type: string
        isAssuranceTulip:
          type: boolean
        productModel:
          type: string
        verticalCategory:
          $ref: '#/components/schemas/RawOnlineStoreVerticalCategoryDto'
        id:
          type: string
        name:
          type: string
        onlineStoreName:
          $ref: '#/components/schemas/LocalizedContent'
        imageUrl:
          type: array
          items:
            type: string
        videoLink:
          type: string
        description:
          $ref: '#/components/schemas/LocalizedContent'
        rank:
          type: number
        productSurveyId:
          type: string
        vat:
          type: number
        onlineAvailability:
          type: boolean
        isAvailable:
          type: boolean
        hideOnOnlineStore:
          type: boolean
      required:
      - type
      - priceModels
      - category
      - tags
      - isRelatedProducts
      - relatedProducts
      - isAssuranceTulip
      - productModel
      - verticalCategory
      - id
      - name
